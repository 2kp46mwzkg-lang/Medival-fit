<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { Sky } from 'three/addons/objects/Sky.js';
import * as BufferGeometryUtils from 'three/addons/utils/BufferGeometryUtils.js';

/* ============================================================
   core.js — logique pure (sans Three.js) : terrain, bruit, grille
   hexagonale, assemblage des bâtiments, disposition du village.
   Testable dans node, inliné dans la page au moment du build.
   ============================================================ */

/* ---------- utilitaires ---------- */
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;
const smooth = (e0, e1, x) => { const t = clamp((x - e0) / (e1 - e0), 0, 1); return t * t * (3 - 2 * t); };
const DEG = Math.PI / 180;

/* générateur pseudo-aléatoire déterministe */
function makeRng(seed) {
  let a = (seed >>> 0) || 1;
  const r = () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
  r.range = (lo, hi) => lo + r() * (hi - lo);
  r.pick = arr => arr[Math.floor(r() * arr.length)];
  r.int = n => Math.floor(r() * n);
  return r;
}

/* bruit de valeur 2D + fbm, déterministe */
function hash2(x, z) { const s = Math.sin(x * 127.1 + z * 311.7) * 43758.5453123; return s - Math.floor(s); }
function vnoise(x, z) {
  const xi = Math.floor(x), zi = Math.floor(z), xf = x - xi, zf = z - zi;
  const u = xf * xf * (3 - 2 * xf), v = zf * zf * (3 - 2 * zf);
  const a = hash2(xi, zi), b = hash2(xi + 1, zi), c = hash2(xi, zi + 1), d = hash2(xi + 1, zi + 1);
  return lerp(lerp(a, b, u), lerp(c, d, u), v);
}
function fbm(x, z, oct = 4) {
  let s = 0, amp = 0.5, f = 1, norm = 0;
  for (let i = 0; i < oct; i++) { s += amp * vnoise(x * f, z * f); norm += amp; f *= 2.03; amp *= 0.5; }
  return s / norm; // 0..1
}

/* ---------- grille hexagonale (pointy-top, axial q,r) ---------- */
const HEX_R = 8.5; // rayon centre -> sommet, en mètres
function hexToWorld(q, r, R = HEX_R) {
  return { x: R * Math.sqrt(3) * (q + r / 2), z: R * 1.5 * r };
}
function hexRing(k) {
  if (k === 0) return [[0, 0]];
  const dirs = [[1, 0], [1, -1], [0, -1], [-1, 0], [-1, 1], [0, 1]];
  let q = -k, r = k; const out = [];
  for (let i = 0; i < 6; i++) for (let j = 0; j < k; j++) { out.push([q, r]); q += dirs[i][0]; r += dirs[i][1]; }
  return out;
}

/* ---------- rivière ---------- */
const RIVER = { x0: -46, depth: 3.0, halfBottom: 4.2, halfTop: 8.5, waterY: -1.35 };
function riverX(z) { return RIVER.x0 + 7 * Math.sin(z * 0.045 + 1.2) + 2.5 * Math.sin(z * 0.11 + 0.4); }
function riverDist(x, z) { return Math.abs(x - riverX(z)); }

/* ---------- chemins (polylignes au sol) ---------- */
function distToSegment(px, pz, ax, az, bx, bz) {
  const dx = bx - ax, dz = bz - az, l2 = dx * dx + dz * dz || 1e-9;
  const t = clamp(((px - ax) * dx + (pz - az) * dz) / l2, 0, 1);
  const cx = ax + t * dx, cz = az + t * dz;
  return Math.hypot(px - cx, pz - cz);
}
function distToPaths(x, z, paths) {
  let d = 1e9;
  for (const p of paths) for (let i = 0; i + 1 < p.length; i++) d = Math.min(d, distToSegment(x, z, p[i][0], p[i][1], p[i + 1][0], p[i + 1][1]));
  return d;
}

/* ---------- terrain ---------- */
const WORLD_HALF = 170;      // demi-largeur du terrain (m)
const VILLAGE_FLAT = 36;     // rayon de la zone plate du village
const PAD_HEXES = [[0, 0], [1, 0], [0, 1], [-1, 1]];
let PADS = null;
function pads() {
  if (!PADS) { PADS = PAD_HEXES.map(([q, r]) => { const w = hexToWorld(q, r); return { x: w.x, z: w.z, h: rawHeight(w.x, w.z) }; }); }
  return PADS;
}
function terrainHeight(x, z) {
  let h = rawHeight(x, z);
  for (const p of pads()) {
    const d = Math.hypot(x - p.x, z - p.z);
    if (d < 11.5) h = lerp(p.h, h, smooth(6.5, 11.5, d));
  }
  return h;
}
function rawHeight(x, z) {
  const r = Math.hypot(x, z);
  // micro-relief partout
  let h = (fbm(x * 0.07 + 11, z * 0.07 + 5, 3) - 0.5) * 0.5;
  // collines douces au-delà du village
  const hills = (fbm(x * 0.016 + 3, z * 0.016 + 7, 4) - 0.42) * 22;
  h += smooth(VILLAGE_FLAT, 95, r) * Math.max(hills, -2.5);
  // montagnes lointaines
  const mount = fbm(x * 0.03 + 40, z * 0.03 + 9, 4) * 38 + 10;
  h += smooth(118, 165, r) * mount;
  // vallée de la rivière
  const d = riverDist(x, z);
  const bank = smooth(RIVER.halfBottom, RIVER.halfTop, d); // 0 au fond, 1 sur la berge
  const valley = smooth(RIVER.halfTop, RIVER.halfTop + 14, d);
  h = Math.min(h, lerp(-RIVER.depth, h * 0.5 - 0.2, bank));
  h = lerp(Math.min(h, 1.5), h, valley);
  return h;
}
function terrainNormal(x, z, e = 0.6) {
  const hl = terrainHeight(x - e, z), hr = terrainHeight(x + e, z), hd = terrainHeight(x, z - e), hu = terrainHeight(x, z + e);
  const nx = hl - hr, nz = hd - hu, ny = 2 * e, l = Math.hypot(nx, ny, nz);
  return { x: nx / l, y: ny / l, z: nz / l };
}

/* ---------- assemblage des bâtiments ----------
   Grille du kit : segment de mur 2 m, niveau 3 m, face extérieure = +Z local.
   Un bâtiment = emprise W x D cellules (2 m), centré sur l'origine, ridge le long de Z.
   Retourne une liste de pièces { kit, name, pos:[x,y,z], rot:y(rad), part:'wall'|'roof'|'prop'|'floor', scale? }
*/
const LEVEL_H = 3.0;
const ROOF_INFO = {  // demi-portée (x) et hauteur du faîte (y) selon la largeur en cellules
  2: { half: 2.757, ridge: 3.72, roof: 'Roof_RoundTiles_4x', gable: 'Roof_Front_Brick4' },
  3: { half: 4.12, ridge: 4.89, roof: 'Roof_RoundTiles_6x', gable: 'Roof_Front_Brick6' },
  4: { half: 4.98, ridge: 6.0, roof: 'Roof_RoundTiles_8x', gable: 'Roof_Front_Brick8' },
};
const SIDES = [
  { id: 'S', rot: 0,            nx: 0,  nz: 1 },
  { id: 'N', rot: Math.PI,      nx: 0,  nz: -1 },
  { id: 'E', rot: Math.PI / 2,  nx: 1,  nz: 0 },
  { id: 'W', rot: -Math.PI / 2, nx: -1, nz: 0 },
];

function buildHouse(opts) {
  const o = Object.assign({ W: 2, D: 2, levels: 1, door: 'S', seed: 1, style: 'plaster', chimney: true, arches: null, vines: true, shutters: true }, opts);
  const rng = makeRng(o.seed * 7919 + 13);
  const pieces = [];
  const V = (name, pos, rot, part, extra) => pieces.push(Object.assign({ kit: 'village', name, pos, rot, part }, extra || {}));
  const P = (name, pos, rot, part, extra) => pieces.push(Object.assign({ kit: 'props', name, pos, rot, part: part || 'prop' }, extra || {}));
  const hw = o.W, hd = o.D; // demi-dimensions en mètres (cellule = 2 m => demi = cellules)
  const roofInfo = ROOF_INFO[o.W] || ROOF_INFO[2];

  for (let lvl = 0; lvl < o.levels; lvl++) {
    const y = lvl * LEVEL_H;
    const stone = (lvl === 0 && o.style !== 'plasterAll');
    for (const s of SIDES) {
      const along = (s.id === 'S' || s.id === 'N') ? o.W : o.D; // cellules le long du côté
      for (let i = 0; i < along; i++) {
        const t = (i + 0.5) / along;               // 0..1 le long du côté
        const u = lerp(-(along), along, t);         // coordonnée le long du côté, en mètres
        // position du centre du segment : sur la ligne d'emprise, face dehors
        let x, z;
        if (s.id === 'S') { x = u; z = hd; } else if (s.id === 'N') { x = -u; z = -hd; }
        else if (s.id === 'E') { x = hw; z = -u; } else { x = -hw; z = u; }
        const isDoor = (lvl === 0 && s.id === o.door && i === Math.floor(along / 2));
        const isArch = (o.arches && o.arches.side === s.id && lvl === 0 && o.arches.cells.includes(i));
        let wall, inserts = [];
        if (isArch) {
          wall = 'Wall_Arch';
        } else if (isDoor) {
          wall = stone ? 'Wall_UnevenBrick_Door_Flat' : 'Wall_Plaster_Door_Flat';
          inserts.push(['DoorFrame_Flat_Brick', 0, 0, 0]);
          inserts.push([rng() < 0.5 ? 'Door_1_Flat' : 'Door_4_Flat', -0.6, 0, 0.0]);
          if (o.torch) inserts.push(['@props:Torch_Metal', 0.95, 1.9, 0.18]);
        } else {
          const r = rng();
          const wantWindow = r < (lvl === 0 ? 0.45 : 0.7);
          if (wantWindow) {
            if (rng() < 0.7) {
              wall = stone ? 'Wall_UnevenBrick_Window_Wide_Flat' : 'Wall_Plaster_Window_Wide_Flat';
              inserts.push(['Window_Wide_Flat1', 0, 0, 0]);
              if (o.shutters && rng() < 0.7) inserts.push(['WindowShutters_Wide_Flat_Open', 0, 0, 0]);
            } else {
              wall = stone ? 'Wall_UnevenBrick_Window_Thin_Round' : 'Wall_Plaster_Window_Thin_Round';
              inserts.push(['Window_Thin_Round1', 0, 0, 0]);
            }
          } else {
            wall = stone ? 'Wall_UnevenBrick_Straight' : (rng() < 0.45 ? 'Wall_Plaster_WoodGrid' : 'Wall_Plaster_Straight');
          }
          if (o.vines && lvl === 0 && !stone && rng() < 0.25) inserts.push(['Prop_Vine1', rng.range(-0.3, 0.3), 2.5, 0.12]);
          if (o.vines && lvl === 0 && stone && rng() < 0.18) inserts.push(['Prop_Vine5', rng.range(-0.2, 0.2), 2.3, 0.12]);
        }
        V(wall, [x, y, z], s.rot, 'wall');
        // inserts dans le repère du mur (x le long, z vers l'extérieur)
        for (const [name, lx, ly, lz] of inserts) {
          const c = Math.cos(s.rot), sn = Math.sin(s.rot);
          const wx = x + lx * c + lz * sn, wz = z - lx * sn + lz * c;
          if (name.startsWith('@props:')) P(name.slice(7), [wx, y + ly, wz], s.rot, 'wall');
          else V(name, [wx, y + ly, wz], s.rot, 'wall');
        }
      }
    }
    // poteaux d'angle
    for (const [cx, cz] of [[hw, hd], [-hw, hd], [hw, -hd], [-hw, -hd]]) V('Corner_Exterior_Wood', [cx, y, cz], 0, 'wall');
  }

  // toit + pignons
  const roofY = o.levels * LEVEL_H + 0.1;
  const lengthCells = Math.max(2, Math.min(5, o.D)) * 2;
  const roofName = o.tower ? 'Roof_Tower_RoundTiles' : roofInfo.roof + lengthCells;
  V(roofName, [0, roofY, 0], 0, 'roof');
  if (!o.tower) {
    V(roofInfo.gable, [0, roofY - 0.1, hd], 0, 'roof');
    V(roofInfo.gable, [0, roofY - 0.1, -hd], Math.PI, 'roof');
  }
  // cheminée sur le versant
  if (o.chimney && !o.tower) {
    const xo = rng.range(0.55, 0.8) * (hw - 0.4) * (rng() < 0.5 ? 1 : -1);
    const slope = (roofInfo.ridge + 0.52) / roofInfo.half;
    const ySurf = -0.52 + (roofInfo.half - Math.abs(xo)) * slope;
    V(rng() < 0.5 ? 'Prop_Chimney' : 'Prop_Chimney2', [xo, roofY + ySurf - 1.0, rng.range(-hd * 0.5, hd * 0.5)], 0, 'roof', { smoke: true });
  }
  return pieces;
}

/* façades de la place du marché et accessoires autour d'un bâtiment */
function houseProps(kind, rng) {
  const P = (name, x, z, rot, kit = 'props') => ({ kit, name, pos: [x, 0, z], rot, part: 'prop' });
  const out = [];
  if (kind === 'house') {
    out.push(P('Barrel', 2.9, 1.2, rng.range(0, 6.28)));
    out.push(P('Crate_Wooden', 3.2, -0.6, rng.range(0, 6.28)));
    out.push(P('Bucket_Wooden_1', 2.5, 2.3, 0));
    out.push(P('Prop_WoodenFence_Single', -1.5, -4.2, 0, 'village'));
    out.push(P('Prop_WoodenFence_Single', -3.5, -4.2, 0, 'village'));
    out.push(P('Prop_WoodenFence_Single', -4.5, -3.2, Math.PI / 2, 'village'));
    out.push(P('Prop_WoodenFence_Single', -4.5, -1.2, Math.PI / 2, 'village'));
    out.push({ kit: 'nature', name: 'Flower_3_Group', pos: [-3.3, 0, -2.6], rot: 0, part: 'prop' });
    out.push({ kit: 'nature', name: 'Bush_Common_Flowers', pos: [3.6, 0, -3.4], rot: 1.2, part: 'prop', scale: 0.8 });
  } else if (kind === 'inn') {
    out.push(P('Table_Large', 5.3, 2.2, 0.2));
    out.push(P('Bench', 5.3, 3.0, 0.2));
    out.push(P('Bench', 5.3, 1.4, 0.2));
    out.push(P('Barrel', -4.6, 2.0, 0.4)); out.push(P('Barrel', -4.9, 2.8, 2.1)); out.push(P('Barrel_Apples', -4.2, 2.9, 1.0));
    out.push(P('Chair_1', 6.6, 2.0, -1.4));
    out.push({ kit: 'village', name: 'Prop_Wagon', pos: [-7.0, 0, -1.5], rot: 0.35, part: 'prop' });
    out.push({ kit: 'village', name: 'Prop_Crate', pos: [-4.4, 0, -3.6], rot: 0.3, part: 'prop' });
  } else if (kind === 'forge') {
    out.push(P('Anvil_Log', 0.3, 0.6, 0.3));
    out.push(P('Workbench', -1.2, -1.6, Math.PI / 2));
    out.push(P('Whetstone', 1.4, -1.4, 0.7));
    out.push(P('Cauldron', 1.3, 1.9, 0));
    out.push(P('Barrel', 3.0, 1.0, 0.6)); out.push(P('Crate_Wooden', 3.2, -0.5, 0.2));
    out.push(P('WeaponStand', -1.6, 1.8, -0.4));
    out.push(P('Dummy', 4.2, 3.6, 0.9));
    out.push(P('Rope_2', 2.4, 3.6, 0));
  } else if (kind === 'market') {
    out.push(P('Stall_Empty', -2.6, 1.6, 0.35)); out.push(P('Stall_Cart_Empty', 2.8, -0.4, -2.4));
    out.push(P('FarmCrate_Apple', -2.2, 0.4, 0.3)); out.push(P('FarmCrate_Carrot', -1.4, 0.3, 0.9)); out.push(P('FarmCrate_Apple', -1.6, 0.9, 0.1));
    out.push(P('Barrel_Apples', 3.6, 1.6, 0)); out.push(P('Barrel', 4.3, 1.2, 1.1));
    out.push(P('Crate_Wooden', 0.4, -3.2, 0.4)); out.push(P('Bag', 1.3, -2.6, 0));
    out.push({ kit: 'props', name: 'Banner_2', pos: [0.12, 4.7, 0], rot: 0, part: 'prop' }); // sur le mât ajouté côté rendu
    out.push({ kit: 'village', name: 'Prop_Crate', pos: [-3.4, 0, -2.4], rot: 0.9, part: 'prop' });
  }
  return out;
}

/* ---------- disposition du village (tranche verticale) ---------- */
function makeLayout(seed = 7) {
  const rng = makeRng(seed);
  const buildings = [
    { id: 'market', kind: 'market', hex: [0, 0], yaw: 0, built: true, label: 'Place du marché' },
    { id: 'house', kind: 'house', hex: [1, 0], yaw: -25 * DEG, built: true, label: 'Maison', spec: { W: 2, D: 2, levels: 1, door: 'W', seed: 3 } },
    { id: 'inn', kind: 'inn', hex: [0, 1], yaw: 15 * DEG, built: false, label: 'Auberge', spec: { W: 3, D: 3, levels: 2, door: 'N', seed: 11, torch: true, style: 'plaster' } },
    { id: 'forge', kind: 'forge', hex: [-1, 1], yaw: 60 * DEG, built: false, label: 'Forge', spec: { W: 2, D: 3, levels: 1, door: 'N', seed: 5, arches: { side: 'E', cells: [0, 1, 2] }, vines: false } },
  ];
  for (const b of buildings) {
    const w = hexToWorld(b.hex[0], b.hex[1]);
    b.pos = [w.x, terrainHeight(w.x, w.z), w.z];
    b.pieces = b.kind === 'market' ? [] : buildHouse(b.spec);
    b.props = houseProps(b.kind, rng);
  }
  // chemins : du centre vers chaque bâtiment, puis vers la rivière et la forêt
  const center = [0, 0];
  const paths = [];
  for (const b of buildings) if (b.kind !== 'market') paths.push([center, [b.pos[0] * 0.55, b.pos[2] * 0.55], [b.pos[0] * 0.78, b.pos[2] * 0.78]]);
  paths.push([center, [-14, -4], [-26, -9], [riverX(-12) + 9.5, -12]]);       // vers la rivière
  paths.push([center, [10, -16], [22, -34], [36, -60], [48, -95]]);          // vers la forêt nord-est
  paths.push([[0, 0], [-6, 18], [-10, 40], [-6, 70]]);                      // vers le sud
  return { buildings, paths };
}

/* ---------- forêt, herbe, rochers : positions instanciées ---------- */
function scatter(layout, seed = 3) {
  const rng = makeRng(seed);
  const occupied = layout.buildings.map(b => ({ x: b.pos[0], z: b.pos[2], r: b.kind === 'market' ? 8 : 9 }));
  const free = (x, z, margin) => {
    for (const o of occupied) if (Math.hypot(x - o.x, z - o.z) < o.r + margin) return false;
    if (riverDist(x, z) < RIVER.halfTop + 1.5 + margin) return false;
    return true;
  };
  const trees = [], bushes = [], rocks = [], grass = [], flowers = [], pebbles = [];
  const treeTypes = ['CommonTree_1', 'CommonTree_2', 'CommonTree_3', 'CommonTree_4', 'CommonTree_5', 'Pine_1', 'Pine_2', 'Pine_3', 'Pine_4', 'Pine_5'];
  // arbres : couronne de forêt, densité par bruit, pins sur les hauteurs
  let tries = 0;
  while (trees.length < 190 && tries++ < 20000) {
    const a = rng() * Math.PI * 2, d = 40 + Math.pow(rng(), 0.6) * 118;
    const x = Math.cos(a) * d, z = Math.sin(a) * d;
    if (Math.abs(x) > WORLD_HALF - 6 || Math.abs(z) > WORLD_HALF - 6) continue;
    const density = fbm(x * 0.03 + 50, z * 0.03 + 50, 3);
    if (rng() > density * 1.25 + smooth(40, 70, d) * 0.25) continue;
    if (!free(x, z, 1)) continue;
    if (distToPaths(x, z, layout.paths) < 4) continue;
    const h = terrainHeight(x, z), n = terrainNormal(x, z);
    if (n.y < 0.72 || h < -0.8) continue;
    let ok = true; for (const t of trees) if (Math.hypot(t.x - x, t.z - z) < 4.2) { ok = false; break; }
    if (!ok) continue;
    const pine = rng() < smooth(2, 12, h) * 0.9 + 0.15;
    const type = pine ? treeTypes[5 + rng.int(5)] : treeTypes[rng.int(5)];
    trees.push({ type, x, y: h - 0.15, z, rot: rng() * 6.28, s: rng.range(0.85, 1.35) });
  }
  // quelques grands arbres tordus comme repères
  for (const [x, z, s] of [[-22, 24, 0.9], [30, 14, 0.8], [8, -36, 1.0]]) {
    if (free(x, z, 2)) trees.push({ type: rng() < 0.5 ? 'TwistedTree_1' : 'TwistedTree_2', x, y: terrainHeight(x, z) - 0.1, z, rot: rng() * 6.28, s });
  }
  // buissons
  tries = 0;
  while (bushes.length < 70 && tries++ < 8000) {
    const a = rng() * 6.28, d = 12 + Math.pow(rng(), 0.7) * 100;
    const x = Math.cos(a) * d, z = Math.sin(a) * d;
    if (!free(x, z, 0.5) || distToPaths(x, z, layout.paths) < 2.2) continue;
    const h = terrainHeight(x, z); if (h < -0.6 || terrainNormal(x, z).y < 0.75) continue;
    bushes.push({ type: rng() < 0.6 ? 'Bush_Common' : 'Bush_Common_Flowers', x, y: h + 0.1, z, rot: rng() * 6.28, s: rng.range(0.7, 1.4) });
  }
  // rochers
  tries = 0;
  while (rocks.length < 26 && tries++ < 6000) {
    const a = rng() * 6.28, d = 16 + rng() * 120;
    const x = Math.cos(a) * d, z = Math.sin(a) * d;
    if (!free(x, z, 1) || distToPaths(x, z, layout.paths) < 2.5) continue;
    const h = terrainHeight(x, z);
    rocks.push({ type: 'Rock_Medium_' + (1 + rng.int(3)), x, y: h - 0.2, z, rot: rng() * 6.28, s: rng.range(0.5, 1.6) });
  }
  // galets au bord de la rivière
  tries = 0;
  while (pebbles.length < 120 && tries++ < 5000) {
    const z = rng.range(-150, 150), side = rng() < 0.5 ? -1 : 1;
    const x = riverX(z) + side * rng.range(RIVER.halfBottom + 0.5, RIVER.halfTop + 2.5);
    const h = terrainHeight(x, z);
    pebbles.push({ type: 'Pebble_Round_' + (1 + rng.int(3)), x, y: h, z, rot: rng() * 6.28, s: rng.range(0.8, 2.2) });
  }
  // touffes d'herbe et fleurs, surtout près du village
  tries = 0;
  while (grass.length < 1400 && tries++ < 30000) {
    const a = rng() * 6.28, d = 4 + Math.pow(rng(), 0.8) * 70;
    const x = Math.cos(a) * d, z = Math.sin(a) * d;
    if (!free(x, z, -2.5) || distToPaths(x, z, layout.paths) < 1.6) continue;
    const h = terrainHeight(x, z); if (h < -0.7) continue;
    if (fbm(x * 0.09 + 7, z * 0.09, 2) < 0.42) continue;
    grass.push({ type: rng() < 0.75 ? 'Grass_Common_Short' : 'Grass_Common_Tall', x, y: h - 0.02, z, rot: rng() * 6.28, s: rng.range(0.7, 1.3) });
  }
  tries = 0;
  while (flowers.length < 90 && tries++ < 8000) {
    const a = rng() * 6.28, d = 6 + rng() * 60;
    const x = Math.cos(a) * d, z = Math.sin(a) * d;
    if (!free(x, z, -1) || distToPaths(x, z, layout.paths) < 1.8) continue;
    const h = terrainHeight(x, z); if (h < -0.6) continue;
    flowers.push({ type: rng() < 0.5 ? 'Flower_3_Group' : 'Flower_4_Group', x, y: h, z, rot: rng() * 6.28, s: rng.range(0.6, 1.0) });
  }
  return { trees, bushes, rocks, grass, flowers, pebbles };
}

/* liste des pièces à charger pour une disposition */
function requiredPieces(layout, sc) {
  const set = new Set();
  for (const b of layout.buildings) { for (const p of b.pieces) set.add(p.kit + '/' + p.name); for (const p of b.props) set.add(p.kit + '/' + p.name); }
  for (const k of ['trees', 'bushes', 'rocks', 'grass', 'flowers', 'pebbles']) for (const it of sc[k]) set.add('nature/' + it.type);
  set.add('village/Floor_UnevenBrick');
  return Array.from(set).sort();
}

/* couleur du sol (vertex color) : herbe, terre des chemins, sable des berges, roche */
function groundColor(x, z, h, ny, paths) {
  const grassA = [0.34, 0.5, 0.19], grassB = [0.5, 0.63, 0.23], grassC = [0.62, 0.65, 0.3];
  const dirt = [0.56, 0.44, 0.29], sand = [0.72, 0.66, 0.5], rock = [0.5, 0.48, 0.44], snow = [0.9, 0.92, 0.95];
  const n1 = fbm(x * 0.05 + 3, z * 0.05 + 9, 3), n2 = fbm(x * 0.21 + 40, z * 0.21 + 2, 2);
  let c = [0, 0, 0];
  for (let i = 0; i < 3; i++) c[i] = lerp(lerp(grassA[i], grassB[i], n1), grassC[i], n2 * 0.5);
  // ombre du sous-bois loin du village
  const far = smooth(45, 90, Math.hypot(x, z)) * 0.25;
  for (let i = 0; i < 3; i++) c[i] *= 1 - far;
  // chemins
  const dp = distToPaths(x, z, paths);
  const pathMix = (1 - smooth(1.2, 2.6 + n2 * 1.2, dp)) * 0.9;
  for (let i = 0; i < 3; i++) c[i] = lerp(c[i], dirt[i] * (0.9 + 0.2 * n2), pathMix);
  // berges
  const dr = riverDist(x, z);
  const sandMix = 1 - smooth(RIVER.halfBottom + 0.5, RIVER.halfTop + 1.5, dr);
  for (let i = 0; i < 3; i++) c[i] = lerp(c[i], sand[i], sandMix);
  // pentes rocheuses et sommets
  const rockMix = smooth(0.86, 0.7, ny);
  for (let i = 0; i < 3; i++) c[i] = lerp(c[i], rock[i] * (0.85 + 0.3 * n2), rockMix);
  const snowMix = smooth(26, 36, h);
  for (let i = 0; i < 3; i++) c[i] = lerp(c[i], snow[i], snowMix);
  return c;
}

function setSun(hour){

/* ================= TERRAIN ================= */
function makeDetailTexture(){
  const n = 256, cv = document.createElement('canvas'); cv.width = cv.height = n;
  const ctx = cv.getContext('2d'), img = ctx.createImageData(n, n), d = img.data;
  for (let y = 0; y < n; y++) for (let x = 0; x < n; x++){
    const v = 0.66 + 0.5 * fbm(x * 0.09, y * 0.09, 3) + 0.1 * (Math.random() - 0.5);
    const i = (y * n + x) * 4; d[i] = d[i+1] = d[i+2] = clamp(v * 255, 0, 255); d[i+3] = 255;
  }
  ctx.putImageData(img, 0, 0);
  const t = new THREE.CanvasTexture(cv); t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(150, 150); t.colorSpace = THREE.NoColorSpace; t.anisotropy = 4;
  return t;
}
function buildTerrain(){
  const size = WORLD_HALF * 2, seg = 200;
  const g = new THREE.PlaneGeometry(size, size, seg, seg); g.rotateX(-Math.PI / 2);
  const p = g.attributes.position, col = new Float32Array(p.count * 3);
  for (let i = 0; i < p.count; i++){
    const x = p.getX(i), z = p.getZ(i), h = terrainHeight(x, z);
    p.setY(i, h);
  }
  g.computeVertexNormals();
  const nrm = g.attributes.normal;
  for (let i = 0; i < p.count; i++){
    const c = groundColor(p.getX(i), p.getZ(i), p.getY(i), nrm.getY(i), layout.paths);
    col[i*3] = Math.pow(c[0], 2.2); col[i*3+1] = Math.pow(c[1], 2.2); col[i*3+2] = Math.pow(c[2], 2.2);
  }
  g.setAttribute('color', new THREE.BufferAttribute(col, 3));
  const m = new THREE.MeshStandardMaterial({ vertexColors: true, map: makeDetailTexture(), roughness: 0.95, metalness: 0 });
  const mesh = new THREE.Mesh(g, m); mesh.receiveShadow = true; mesh.name = 'terrain';
  scene.add(mesh);
  return mesh;
}

/* ================= RIVIÈRE ================= */
function buildWater(){
  const zs = []; for (let z = -WORLD_HALF; z <= WORLD_HALF; z += 4) zs.push(z);
  const W = RIVER.halfTop + 1.5, pos = [], uv = [], idx = [];
  zs.forEach((z, i) => { const xc = riverX(z); pos.push(xc - W, RIVER.waterY, z, xc + W, RIVER.waterY, z); uv.push(0, z / 20, 1, z / 20); if (i){ const a = (i-1)*2; idx.push(a, a+1, a+2, a+1, a+3, a+2); } });
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3)); g.setAttribute('uv', new THREE.Float32BufferAttribute(uv, 2)); g.setIndex(idx); g.computeVertexNormals();
  const mat = new THREE.ShaderMaterial({
    uniforms: THREE.UniformsUtils.merge([THREE.UniformsLib.fog, { uTime: { value: 0 }, uSun: { value: new THREE.Vector3(0, 1, 0) }, uSunColor: { value: new THREE.Color(1, 0.95, 0.85) }, uSky: { value: new THREE.Color(0.55, 0.7, 0.85) }, uDeep: { value: new THREE.Color(0.07, 0.2, 0.26) }, uShallow: { value: new THREE.Color(0.22, 0.45, 0.45) } }]),
    vertexShader: `
      #include <fog_pars_vertex>
      varying vec3 vW; varying vec2 vUv;
      void main(){ vUv = uv; vec4 wp = modelMatrix * vec4(position,1.0); vW = wp.xyz; vec4 mvPosition = viewMatrix * wp; gl_Position = projectionMatrix * mvPosition;
        #include <fog_vertex>
      }`,
    fragmentShader: `
      #include <fog_pars_fragment>
      uniform float uTime; uniform vec3 uSun, uSunColor, uSky, uDeep, uShallow; varying vec3 vW; varying vec2 vUv;
      float h(vec2 p){ return fract(sin(dot(p, vec2(127.1,311.7))) * 43758.5453); }
      float n(vec2 p){ vec2 i = floor(p), f = fract(p); vec2 u = f*f*(3.0-2.0*f);
        return mix(mix(h(i), h(i+vec2(1,0)), u.x), mix(h(i+vec2(0,1)), h(i+vec2(1,1)), u.x), u.y); }
      void main(){
        vec2 p = vW.xz;
        float n1 = n(p*0.9 + vec2(uTime*0.35, uTime*0.9));
        float n2 = n(p*1.7 - vec2(uTime*0.6, uTime*0.4));
        float n3 = n(p*3.5 + vec2(-uTime*0.9, uTime*1.3));
        vec3 N = normalize(vec3((n1-0.5)*0.35 + (n2-0.5)*0.25 + (n3-0.5)*0.12, 1.0, (n2-0.5)*0.35 + (n3-0.5)*0.15));
        vec3 V = normalize(cameraPosition - vW);
        float fres = pow(1.0 - max(dot(N, V), 0.0), 3.0);
        float edge = 1.0 - smoothstep(0.0, 0.45, min(vUv.x, 1.0 - vUv.x));
        vec3 base = mix(uDeep, uShallow, edge*0.8 + 0.2*n2);
        vec3 col = mix(base, uSky, 0.25 + 0.55*fres);
        vec3 H = normalize(uSun + V);
        float spec = pow(max(dot(N, H), 0.0), 180.0) * 1.6 + pow(max(dot(N, H), 0.0), 24.0) * 0.25;
        col += uSunColor * spec;
        float foam = smoothstep(0.62, 0.9, n3 * edge + edge*0.35);
        col = mix(col, vec3(0.9, 0.95, 0.95), foam * 0.6);
        float alpha = mix(0.86, 0.6, edge*0.6);
        gl_FragColor = vec4(col, alpha);
        #include <fog_fragment>
      }`,
    transparent: true, depthWrite: false, fog: true, side: THREE.DoubleSide
  });
  const mesh = new THREE.Mesh(g, mat); mesh.renderOrder = 2; mesh.name = 'water';
  scene.add(mesh);
  return mesh;
}

/* ================= CHARGEMENT DES PIÈCES ================= */
if (GLB_EXT === 'json'){ try { window.createImageBitmap = undefined; } catch (e) {} }
const loader = new GLTFLoader();
const pieces = {};          // 'kit/Nom' -> { root, parts:[{geometry, material, matrix}] }
const materials = {};       // 'kit:MI_x' -> material partagé
function registerMaterial(kit, m){
  const key = kit + ':' + m.name;
  if (!materials[key]){
    if (m.map) m.map.anisotropy = 4;
    if (m.transparent && m.name.includes('Glass')){ m.opacity = 0.35; m.roughness = 0.15; m.metalness = 0.2; m.envMapIntensity = 1.2; }
    if (m.alphaTest > 0){ m.side = THREE.DoubleSide; }
    if (/Leaves|Leaf|Grass|Flowers|Vine/i.test(m.name)){ m.roughness = 0.9; }
    materials[key] = m;
  }
  return materials[key];
}
function registerPieces(kit, gltf){
  const root = gltf.scene; root.updateMatrixWorld(true);
  for (const node of root.children){          // un nœud parent par pièce, nommé comme la pièce
    const parts = [];
    node.traverse(o => {
      if (!o.isMesh) return;
      o.material = registerMaterial(kit, o.material);
      const g = o.geometry;
      for (const a of Object.keys(g.attributes)) if (!['position', 'normal', 'uv', 'color'].includes(a)) g.deleteAttribute(a);
      if (!g.attributes.normal) g.computeVertexNormals();
      parts.push({ geometry: g, material: o.material, matrix: o.matrixWorld.clone() });
    });
    pieces[kit + '/' + node.name] = { parts, bbox: manifest[kit] && manifest[kit][node.name] };
  }
}
function makeGLB(jsonText, bin){
  const enc = new TextEncoder().encode(jsonText);
  const jl = (enc.length + 3) & ~3, bl = (bin.length + 3) & ~3;
  const out = new Uint8Array(12 + 8 + jl + 8 + bl), dv = new DataView(out.buffer);
  dv.setUint32(0, 0x46546C67, true); dv.setUint32(4, 2, true); dv.setUint32(8, out.length, true);
  dv.setUint32(12, jl, true); dv.setUint32(16, 0x4E4F534A, true); out.set(enc, 20); for (let i = enc.length; i < jl; i++) out[20 + i] = 0x20;
  dv.setUint32(20 + jl, bl, true); dv.setUint32(24 + jl, 0x004E4942, true); out.set(bin, 28 + jl);
  return out.buffer;
}
function b64ToBytes(b64){
  const s = atob(b64), n = s.length, out = new Uint8Array(n);
  for (let i = 0; i < n; i++) out[i] = s.charCodeAt(i);
  return out;
}
async function loadKit(kit, onProgress){
  const url = KIT + kit + '.' + GLB_EXT;
  if (GLB_EXT !== 'json') return loader.loadAsync(url, ev => { if (ev.total) onProgress(ev.loaded / ev.total); });
  // variante hébergée : glTF JSON avec buffer en base64 -> on reconstruit un GLB en mémoire (pas de fetch data:)
  const res = await fetch(url); if (!res.ok) throw new Error('kit ' + kit + ' introuvable (' + res.status + ')');
  const total = +res.headers.get('content-length') || 0; const reader = res.body && res.body.getReader ? res.body.getReader() : null;
  let text;
  if (reader){ const chunks = []; let got = 0; for (;;){ const { done, value } = await reader.read(); if (done) break; chunks.push(value); got += value.length; if (total) onProgress(Math.min(0.9, got / total)); }
    const all = new Uint8Array(got); let o = 0; for (const c of chunks){ all.set(c, o); o += c.length; } text = new TextDecoder().decode(all); }
  else text = await res.text();
  const js = JSON.parse(text); const uri = js.buffers[0].uri;
  const bin = b64ToBytes(uri.slice(uri.indexOf(',') + 1));
  delete js.buffers[0].uri; js.buffers[0].byteLength = bin.length;
  const glb = makeGLB(JSON.stringify(js), bin);
  return new Promise((ok, ko) => loader.parse(glb, '', ok, ko));
}
async function loadAll(onProgress){

/* fusion des pièces d'un bâtiment par matériau -> quelques meshes */
function buildStatic(list, originMatrix){
  const byMat = new Map();
  for (const p of list){
    const pc = pieces[p.kit + '/' + p.name]; if (!pc) continue;
    const base = composeTRS(p.pos[0], p.pos[1], p.pos[2], p.rot, p.scale || 1);
    for (const part of pc.parts){
      const g = part.geometry.clone();
      g.applyMatrix4(new THREE.Matrix4().copy(originMatrix).multiply(base).multiply(part.matrix));
      if (!byMat.has(part.material)) byMat.set(part.material, []);
      byMat.get(part.material).push(g);
    }
  }
  const group = new THREE.Group(); const mats = [];
  for (const [mat, geos] of byMat){
    let merged = null;
    try {
      const allIndexed = geos.every(g => g.index), noneIndexed = geos.every(g => !g.index);
      const gs = (allIndexed || noneIndexed) ? geos : geos.map(g => g.index ? g.toNonIndexed() : g);
      merged = BufferGeometryUtils.mergeGeometries(gs, false);
    } catch (e) { console.warn('fusion impossible', mat.name, e); }
    const m = mat.clone(); mats.push(m);
    if (merged){
      const mesh = new THREE.Mesh(merged, m); mesh.castShadow = true; mesh.receiveShadow = true; group.add(mesh);
    } else {
      for (const g of geos){ const mesh = new THREE.Mesh(g, m); mesh.castShadow = true; mesh.receiveShadow = true; group.add(mesh); }
    }
  }
  group.userData.materials = mats;
  return group;
}

    const side = Math.floor(Math.random()*4), u = Math.random(), pad = .4;
    const x = side < 2 ? lerp(box.min.x, box.max.x, u) : (side === 2 ? box.min.x - pad : box.max.x + pad);
    const z = side >= 2 ? lerp(box.min.z, box.max.z, u) : (side === 0 ? box.min.z - pad : box.max.z + pad);
    Particles.spawn({ x, y: Math.max(box.min.y + .2, level - Math.random()*.6), z, vx: (Math.random()-.5)*1.2, vy: .2 + Math.random()*.8, vz: (Math.random()-.5)*1.2, c: DUST[i % 2], size: .6 + Math.random()*.9, grow: 1.6, life: 1.2 + Math.random()*.9, alpha: .35, drag: 1.2, lift: .25 });
  }
  if (!cine.burst && t >= BURST_AT){ cine.burst = true; clipPlane.constant = 1e4;
    const c = cine.center, sx = box.max.x - box.min.x;
    for (let i = 0; i < 600; i++){ const x = lerp(box.min.x, box.max.x, Math.random()), z = lerp(box.min.z, box.max.z, Math.random()), yy = lerp(box.min.y + cine.h*.3, box.max.y, Math.random());
      const dx = x - c.x, dz = z - c.z, dl = Math.hypot(dx, dz) || 1, sp = 2.5 + Math.random()*7;
      Particles.spawn({ x, y: yy, z, vx: dx/dl*sp + (Math.random()-.5)*2, vy: 1.5 + Math.random()*4.5, vz: dz/dl*sp + (Math.random()-.5)*2, c: POWDER[i % POWDER.length], size: (1 + Math.random()*1.3) * Math.max(1, sx/9), grow: 2 + Math.random()*1.5, life: 2.4 + Math.random()*1.6, alpha: .6 + Math.random()*.3, drag: 1.7, lift: .5 }); } }
  if (!cine.burst2 && t >= BURST_AT + .4){ cine.burst2 = true; for (let i = 0; i < 220; i++){ const a2 = Math.random()*6.28, sp = 3 + Math.random()*6;
    Particles.spawn({ x: cine.center.x + (Math.random()-.5)*2, y: box.max.y + .3, z: cine.center.z + (Math.random()-.5)*2, vx: Math.cos(a2)*sp, vy: 4 + Math.random()*5, vz: Math.sin(a2)*sp, c: POWDER[(i*3) % POWDER.length], size: .9 + Math.random()*.9, grow: 2.2, life: 2.2 + Math.random()*1.2, alpha: .55 + Math.random()*.3, drag: 1.5, lift: -.4 }); } }
  if (t >= BURST_AT){ const f = clamp((t - BURST_AT) / .9, 0, 1); cine.scaffold.userData.mat.opacity = 1 - f; cine.scaffold.position.y = -f * .9; if (f >= 1) cine.scaffold.visible = false; }
  if (t >= CINE_END) finishBuild(false);
}
function finishBuild(skipped){
  cine.active = false; clipPlane.constant = 1e4; clipScaff.constant = 1e4;
  if (cine.scaffold){ scene.remove(cine.scaffold); cine.scaffold = null; }
  cine.b.group.userData.materials.forEach(m => { m.clippingPlanes = null; });
  // on rend la main à la caméra là où elle est
  cam.locked = false;
  cam.target.copy(cine.center); cam.target.y = terrainHeight(cam.target.x, cam.target.z);
  const d = camera.position.clone().sub(cam.target); cam.dist = clamp(d.length(), 7, 125); cam.yaw = Math.atan2(d.x, d.z); cam.pitchOff = 0;
  applyCamera();
  showMsg(cine.b.b.label + ' terminée !');
}
function nextToBuild(){ return layout.buildings.find(b => !b.built); }
function updateBuildButton(){ const n = nextToBuild(); const btn = $('#build'); if (n){ btn.disabled = false; btn.textContent = 'Construire : ' + n.label; } else { btn.disabled = true; btn.textContent = 'Tous les bâtiments de l’essai sont construits'; } }
$('#build').addEventListener('click', () => { const n = nextToBuild(); if (n && !cine.active) startBuild(n.id); });
$('#focus').addEventListener('click', () => { if (cam.locked) return; fly = { from: cam.target.clone(), to: new THREE.Vector3(2, 0, 4), d0: cam.dist, d1: 42, t: 0 }; });
$('#hour').addEventListener('input', e => { const h = parseFloat(e.target.value); $('#hourTxt').textContent = Math.floor(h) + ' h' + (h % 1 >= .5 ? '30' : ''); setSun(h); });

/* ================= DIVERS UI ================= */
let hintShown = true; function hideHint(){ if (hintShown){ hintShown = false; setTimeout(() => { $('#hint').textContent = 'Double-touche : s’approcher d’un point. Le curseur règle l’heure.'; }, 400); } }
let msgT = null; function showMsg(t){ const m = $('#msg'); m.textContent = t; m.style.opacity = 1; clearTimeout(msgT); msgT = setTimeout(() => m.style.opacity = 0, 3500); }

/* ================= BOUCLE ================= */
function resize(){ const w = window.innerWidth, h = window.innerHeight; renderer.setSize(w, h, false); camera.aspect = w / h; camera.fov = w < h ? 52 : 42; camera.updateProjectionMatrix(); Particles.setScale(h); }
window.addEventListener('resize', resize);
let water = null; const clock = new THREE.Clock(); let fpsN = 0, fpsT = 0, fps = 0, smokeT = 0;
function loop(){
  const dt = Math.min(clock.getDelta(), .05), now = clock.elapsedTime;
  if (cine.active) updateBuild(dt); else updateCamera(dt);
  if (water) water.material.uniforms.uTime.value = now;
  // fumée des cheminées
  smokeT += dt; if (smokeT > .12){ smokeT = 0; for (const id in built) for (const c of built[id].chimneys) Particles.spawn({ x: c.x + (Math.random()-.5)*.3, y: c.y, z: c.z + (Math.random()-.5)*.3, vx: (Math.random()-.5)*.3 + .25, vy: .8 + Math.random()*.5, vz: (Math.random()-.5)*.3, c: SMOKE[Math.random() < .5 ? 0 : 1], size: .5 + Math.random()*.4, grow: 2.4, life: 2.5 + Math.random()*1.5, alpha: .28, drag: .5, lift: .35 }); }
  Particles.update(dt);
  renderer.render(scene, camera);
  fpsN++; fpsT += dt; if (fpsT >= 1){ fps = Math.round(fpsN / fpsT); fpsN = 0; fpsT = 0; const i = renderer.info.render; $('#stats').textContent = fps + ' im/s · ' + Math.round(i.triangles / 1000) + 'k tri · ' + i.calls + ' appels'; }
}

/* ================= DÉMARRAGE ================= */
async function main(){
  const bar = $('#bar'), lm = $('#loadmsg');
  lm.textContent = 'Terrain et rivière…'; await new Promise(r => setTimeout(r, 30));
  buildTerrain(); water = buildWater();
  setSun(parseFloat($('#hour').value)); bakeEnv();
  lm.textContent = 'Chargement des kits 3D (16 Mo)…';
  const prog = { village: 0, nature: 0, props: 0 };
  await loadAll((kit, f) => { prog[kit] = f; const tot = (prog.village * 5 + prog.nature * 8 + prog.props * 4) / 17; bar.style.width = (tot * 100) + '%'; lm.textContent = 'Chargement des kits 3D… ' + Math.round(tot * 100) + ' %'; });
  lm.textContent = 'Assemblage du village…'; await new Promise(r => setTimeout(r, 30));
  createPlaza();
  for (const b of layout.buildings) if (b.built && b.kind !== 'market') createBuilding(b);
  createNature();
  updateBuildButton();
  resize(); applyCamera();
  renderer.compile(scene, camera);
  renderer.setAnimationLoop(loop);
  window.__ready = true;
  window.__v3d = { cam, applyCamera, camera, scene, renderer, startBuild, built, layout, setSun, THREE };
  const l = $('#load'); l.style.opacity = 0; setTimeout(() => l.remove(), 900);
}
main().catch(e => { console.error(e); fatal('Erreur au démarrage : ' + (e && e.message ? e.message : e)); });
</script>
</body>
