setTimeout(function(){ if (!window.__ready && !window.__fatal) fatal("Le moteur 3D met du temps à se charger. Vérifiez la connexion internet puis rechargez. Il faut iOS 16.4 ou plus récent."); }, 25000);
window.addEventListener('error', function(e){ if (!window.__ready) fatal('Erreur : ' + (e.message || e)); });

<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import * as SkeletonUtils from 'three/addons/utils/SkeletonUtils.js';
import { Sky } from 'three/addons/objects/Sky.js';
import * as BufferGeometryUtils from 'three/addons/utils/BufferGeometryUtils.js';

/* ============================================================
   core.js — logique pure (sans Three.js) : terrain, bruit, grille
   hexagonale, assemblage des bâtiments, disposition du village.
   Testable dans node, inliné dans la page au moment du build.
   ============================================================ */

/* ---------- utilitaires ---------- */
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;
const smooth = (e0, e1, x) => { const t = clamp((x - e0) / (e1 - e0), 0, 1); return t * t * (3 - 2 * t); };
const DEG = Math.PI / 180;

/* générateur pseudo-aléatoire déterministe */
function makeRng(seed) {
  let a = (seed >>> 0) || 1;
  const r = () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
  r.range = (lo, hi) => lo + r() * (hi - lo);
  r.pick = arr => arr[Math.floor(r() * arr.length)];
  r.int = n => Math.floor(r() * n);
  return r;
}

/* bruit de valeur 2D + fbm, déterministe */
function hash2(x, z) { const s = Math.sin(x * 127.1 + z * 311.7) * 43758.5453123; return s - Math.floor(s); }
function vnoise(x, z) {
  const xi = Math.floor(x), zi = Math.floor(z), xf = x - xi, zf = z - zi;
  const u = xf * xf * (3 - 2 * xf), v = zf * zf * (3 - 2 * zf);
  const a = hash2(xi, zi), b = hash2(xi + 1, zi), c = hash2(xi, zi + 1), d = hash2(xi + 1, zi + 1);
  return lerp(lerp(a, b, u), lerp(c, d, u), v);
}
function fbm(x, z, oct = 4) {
  let s = 0, amp = 0.5, f = 1, norm = 0;
  for (let i = 0; i < oct; i++) { s += amp * vnoise(x * f, z * f); norm += amp; f *= 2.03; amp *= 0.5; }
  return s / norm; // 0..1
}

/* ---------- rivière ---------- */
const RIVER = { x0: -58, depth: 3.0, halfBottom: 4.2, halfTop: 8.5, waterY: -1.35 };   // la rivière longe la muraille ouest (berge à 6 m du mur au plus près)
function riverX(z) { return RIVER.x0 + 7 * Math.sin(z * 0.045 + 1.2) + 2.5 * Math.sin(z * 0.11 + 0.4); }
function riverDist(x, z) { return Math.abs(x - riverX(z)); }

/* ---------- chemins (polylignes au sol) ---------- */
function distToSegment(px, pz, ax, az, bx, bz) {
  const dx = bx - ax, dz = bz - az, l2 = dx * dx + dz * dz || 1e-9;
  const t = clamp(((px - ax) * dx + (pz - az) * dz) / l2, 0, 1);
  const cx = ax + t * dx, cz = az + t * dz;
  return Math.hypot(px - cx, pz - cz);
}
/* index spatial des segments de chemin (cases de 8 m) : distance, côté et abscisse le long du chemin le plus proche */
function pathIndex(paths) {
  const segs = [], C = 8, M = 8, grid = new Map();
  for (const pl of paths) { let s0 = 0; for (let i = 0; i + 1 < pl.length; i++) { const [ax, az] = pl[i], [bx, bz] = pl[i + 1], L = Math.hypot(bx - ax, bz - az) || 1e-6; segs.push({ ax, az, L, dx: (bx - ax) / L, dz: (bz - az) / L, s0 }); s0 += L;
    const k = segs.length - 1; for (let ix = Math.floor((Math.min(ax, bx) - M) / C); ix <= Math.floor((Math.max(ax, bx) + M) / C); ix++) for (let iz = Math.floor((Math.min(az, bz) - M) / C); iz <= Math.floor((Math.max(az, bz) + M) / C); iz++) {
      const key = ix * 100003 + iz; let l = grid.get(key); if (!l) grid.set(key, l = []); l.push(k); } } }
  function query(x, z) {
    const l = grid.get(Math.floor(x / C) * 100003 + Math.floor(z / C)); if (!l) return null;
    let best = null, bd = 1e9;
    for (const k of l) { const g = segs[k]; const t = clamp((x - g.ax) * g.dx + (z - g.az) * g.dz, 0, g.L); const cx = g.ax + g.dx * t, cz = g.az + g.dz * t, d = Math.hypot(x - cx, z - cz);
      if (d < bd) { bd = d; best = { d, u: (x - g.ax) * g.dz - (z - g.az) * g.dx, s: g.s0 + (x - g.ax) * g.dx + (z - g.az) * g.dz, px: g.dz, pz: -g.dx }; } }
    return best;
  }
  return { segs, query, dist(x, z) { const q = query(x, z); return q ? q.d : 1e9; } };
}
function distToPaths(x, z, paths) {
  let d = 1e9;
  for (const p of paths) for (let i = 0; i + 1 < p.length; i++) d = Math.min(d, distToSegment(x, z, p[i][0], p[i][1], p[i + 1][0], p[i + 1][1]));
  return d;
}

/* ---------- terrain ---------- */
const WORLD_HALF = 260;      // demi-largeur du terrain détaillé (m) ; au-delà, le terrain lointain et les montagnes (page)
const FAR_HALF = 1404;       // demi-largeur du terrain lointain (maillage à 13 m, troué sous le terrain détaillé)
const MOUNT_R = 600;         // la crête principale des montagnes, à environ 600 m du village
const VILLAGE_FLAT = 50;     // rayon de la zone plate du village (les angles de la muraille sont à 45 m)

/* ---------- le plan du village : une bastide ----------
   Enceinte carrée (palissade de bois, puis murailles de pierre plus larges), place centrale entourée d'une rue en boucle,
   les commerces et les bâtiments publics autour de la place, le quartier des maisons au sud-ouest le long de sa rue,
   la ferme et la grange hors les murs de part et d'autre de la route du sud, le moulin et la tour de guet sur la route
   du nord, le pont sur la rivière au bout de la route de l'ouest.
   Repère : x vers l'est, z vers le sud. La façade d'un bâtiment (+z local) regarde la direction donnée par yaw
   (0 = sud, π = nord, π/2 = est, −π/2 = ouest). */
const PAL_HALF = 23, WALL_HALF = 34;    // demi-côtés des enceintes carrées (m)
const SQUARE_R = 11.5;                   // demi-côté de la rue qui fait le tour de la place
const GATES = [[0, 1], [-1, 0], [0, -1]];   // portes : sud, ouest, nord (direction depuis le centre)
const BRIDGE_Z = 0;                      // le pont, au bout de la route de l'ouest
const HOUSE_ST_Z = 23;                   // la rue des maisons (est-ouest, depuis la rue du sud)
const PLAN = {
  market: { x: 0, z: 0, yaw: 0 },                               // la place
  church: { x: -12.5, z: -15.5, yaw: 0 },                       // nord de la place, à l'ouest de la rue du nord (le clocher vers la rue)
  forge: { x: 11, z: -14.5, yaw: 0 },                             // nord-est de la place, les arches ouvertes sur la place
  townhall: { x: 15.5, z: 0, yaw: -Math.PI / 2 },               // est de la place, le balcon sur la place
  inn: { x: 11, z: 17, yaw: Math.PI },                          // sud-est de la place, la terrasse sur la place
  bakery: { x: -15, z: -7, yaw: Math.PI / 2, garden: 'N' },     // ouest de la place, au nord de la rue de l'ouest
  chapel: { x: -15, z: 7.5, yaw: Math.PI / 2 },                 // ouest de la place, au sud de la rue de l'ouest (clocher côté rue)
  house: { x: -11, z: 19, yaw: 0, garden: 'N' },                // quartier des maisons : rangée nord de la rue des maisons, jardins derrière
  house2: { x: -19, z: 19, yaw: 0, garden: 'N' },
  house3: { x: -11, z: 28, yaw: Math.PI, garden: 'E' },         // rangée sud (entre la palissade et la muraille), jardins à droite de la porte
  house4: { x: -23, z: 27, yaw: Math.PI, garden: 'E' },
  keep: { x: 23, z: -23, yaw: -Math.PI / 2 },                   // le donjon dans l'angle nord-est de l'enceinte, la porte vers la ville
  farm: { x: -16, z: 46, yaw: Math.PI / 2 },                    // hors les murs, à l'ouest de la route du sud (l'enclos derrière)
  barn: { x: 16, z: 46, yaw: -Math.PI / 2 },                    // hors les murs, à l'est de la route du sud
  mill: { x: -20, z: -48, yaw: Math.PI / 2 },                   // sur la route du nord, à l'ouest
  watchtower: { x: 12, z: -54, yaw: -Math.PI / 2 },             // sur la route du nord, à l'est, le balcon vers la route
};
// le terrain est aplani sous chaque bâtiment, sous la place et sous les angles de l'enceinte
let PADS = null;
function pads() {
  if (!PADS) {
    const pts = Object.values(PLAN).map(p => [p.x, p.z]);
    for (const sx of [-1, 1]) for (const sz of [-1, 1]) pts.push([sx * WALL_HALF, sz * WALL_HALF]);
    for (const [gx, gz] of GATES) pts.push([gx * WALL_HALF, gz * WALL_HALF]);
    PADS = pts.map(([x, z]) => ({ x, z, h: rawHeight(x, z) }));
  }
  return PADS;
}
function terrainHeight(x, z) {
  let h = rawHeight(x, z);
  for (const p of pads()) {
    const d = Math.hypot(x - p.x, z - p.z);
    if (d < 11.5) h = lerp(p.h, h, smooth(6.5, 11.5, d));
  }
  return h;
}
function rawHeight(x, z) {
  const r = Math.hypot(x, z);
  // micro-relief partout
  let h = (fbm(x * 0.07 + 11, z * 0.07 + 5, 3) - 0.5) * 0.5;
  // collines douces au-delà du village
  const hills = (fbm(x * 0.016 + 3, z * 0.016 + 7, 4) - 0.42) * 22;
  h += smooth(VILLAGE_FLAT, 105, r) * Math.max(hills, -2.5);
  // contreforts puis chaîne de montagnes (gorges de la rivière, cols des routes)
  if (r > 200) h += mountainHeight(x, z, r);
  // vallée de la rivière
  const d = riverDist(x, z);
  const bank = smooth(RIVER.halfBottom, RIVER.halfTop, d); // 0 au fond, 1 sur la berge
  const valley = smooth(RIVER.halfTop, RIVER.halfTop + 14, d);
  h = Math.min(h, lerp(-RIVER.depth, h * 0.5 - 0.2, bank));
  h = lerp(Math.min(h, 1.5), h, valley);
  return h;
}
/* la chaîne de montagnes : contreforts dès 200 m, crêtes (bruit « en arêtes ») qui culminent vers 600–700 m à 300–400 m de haut,
   puis redescendent derrière ; une gorge de chaque côté pour la rivière, un col dans l'axe de la route du nord et de celle de l'ouest */
const COL_ANGLES = [-78.5 * DEG, 170 * DEG];
function ridgeNoise(x, z) { let s = 0, amp = 0.5, f = 1, n = 0; for (let i = 0; i < 4; i++) { const v = 1 - Math.abs(vnoise(x * f, z * f) * 2 - 1); s += amp * v * v; n += amp; f *= 2.07; amp *= 0.5; } return s / n; }
function mountainHeight(x, z, r) {
  let h = smooth(200, 470, r) * (14 + 70 * fbm(x * 0.006 + 13, z * 0.006 + 71, 4));                 // contreforts
  const ring = smooth(440, MOUNT_R + 10, r) * (1 - 0.45 * smooth(780, 1150, r));
  h += ring * (150 + 470 * ridgeNoise(x * 0.0042 + 7, z * 0.0042 + 3));                               // la chaîne
  const a = Math.atan2(z, x); let col = 1;
  for (const c of COL_ANGLES) { const d = Math.abs(Math.atan2(Math.sin(a - c), Math.cos(a - c))); col = Math.min(col, 1 - 0.72 * Math.exp(-(d / 0.15) * (d / 0.15))); }
  const gorge = smooth(18, 150, riverDist(x, z));
  return h * col * gorge;
}
function terrainNormal(x, z, e = 0.6) {
  const hl = terrainHeight(x - e, z), hr = terrainHeight(x + e, z), hd = terrainHeight(x, z - e), hu = terrainHeight(x, z + e);
  const nx = hl - hr, nz = hd - hu, ny = 2 * e, l = Math.hypot(nx, ny, nz);
  return { x: nx / l, y: ny / l, z: nz / l };
}

/* ---------- assemblage des bâtiments ----------
   Grille du kit : segment de mur 2 m, niveau 3 m, face extérieure = +Z local.
   Un bâtiment = emprise W x D cellules (2 m), centré sur l'origine, ridge le long de Z.
   Retourne une liste de pièces { kit, name, pos:[x,y,z], rot:y(rad), part:'wall'|'roof'|'prop'|'floor', scale? }
*/
const LEVEL_H = 3.0;
const ROOF_INFO = {  // demi-portée (x) et hauteur du faîte (y) selon la largeur en cellules
  2: { half: 2.757, ridge: 3.72, roof: 'Roof_RoundTiles_4x', gable: 'Roof_Front_Brick4' },
  3: { half: 4.12, ridge: 4.89, roof: 'Roof_RoundTiles_6x', gable: 'Roof_Front_Brick6' },
  4: { half: 4.98, ridge: 6.0, roof: 'Roof_RoundTiles_8x', gable: 'Roof_Front_Brick8' },
};
const SIDES = [
  { id: 'S', rot: 0,            nx: 0,  nz: 1 },
  { id: 'N', rot: Math.PI,      nx: 0,  nz: -1 },
  { id: 'E', rot: Math.PI / 2,  nx: 1,  nz: 0 },
  { id: 'W', rot: -Math.PI / 2, nx: -1, nz: 0 },
];

function buildHouse(opts) {
  const o = Object.assign({ W: 2, D: 2, levels: 1, door: 'S', seed: 1, style: 'plaster', chimney: true, arches: null, vines: true, shutters: true, balcony: false, banners: false, windows: 1 }, opts);
  const rng = makeRng(o.seed * 7919 + 13);
  const pieces = [];
  const V = (name, pos, rot, part, extra) => pieces.push(Object.assign({ kit: 'village', name, pos, rot, part }, extra || {}));
  const P = (name, pos, rot, part, extra) => pieces.push(Object.assign({ kit: 'props', name, pos, rot, part: part || 'prop' }, extra || {}));
  const hw = o.W, hd = o.D; // demi-dimensions en mètres (cellule = 2 m => demi = cellules)
  const roofInfo = ROOF_INFO[o.W] || ROOF_INFO[2];

  // soubassement : niveaux de pierre aveugles sous le sol (tours au bord de l'eau, terrain en pente)
  for (let p = 1; p <= (o.plinth || 0); p++) {
    const y = -p * LEVEL_H;
    for (const s of SIDES) {
      const along = (s.id === 'S' || s.id === 'N') ? o.W : o.D;
      for (let i = 0; i < along; i++) {
        const u = lerp(-(along), along, (i + 0.5) / along);
        let x, z;
        if (s.id === 'S') { x = u; z = hd; } else if (s.id === 'N') { x = -u; z = -hd; }
        else if (s.id === 'E') { x = hw; z = -u; } else { x = -hw; z = u; }
        V('Wall_UnevenBrick_Straight', [x, y, z], s.rot, 'wall');
      }
    }
    for (const [cx, cz] of [[hw, hd], [-hw, hd], [hw, -hd], [-hw, -hd]]) V('Corner_Exterior_Wood', [cx, y, cz], 0, 'wall');
  }

  for (let lvl = 0; lvl < o.levels; lvl++) {
    const y = lvl * LEVEL_H;
    const stone = o.style === 'stone' || (lvl === 0 && o.style !== 'plasterAll');
    for (const s of SIDES) {
      const along = (s.id === 'S' || s.id === 'N') ? o.W : o.D; // cellules le long du côté
      for (let i = 0; i < along; i++) {
        const t = (i + 0.5) / along;               // 0..1 le long du côté
        const u = lerp(-(along), along, t);         // coordonnée le long du côté, en mètres
        // position du centre du segment : sur la ligne d'emprise, face dehors
        let x, z;
        if (s.id === 'S') { x = u; z = hd; } else if (s.id === 'N') { x = -u; z = -hd; }
        else if (s.id === 'E') { x = hw; z = -u; } else { x = -hw; z = u; }
        const isDoor = (lvl === 0 && o.door && s.id === o.door && i === Math.floor(along / 2));
        const isArch = (o.arches && o.arches.side === s.id && lvl === 0 && o.arches.cells.includes(i));
        let wall, inserts = [];
        if (isArch) {
          wall = 'Wall_Arch';
        } else if (isDoor) {
          wall = stone ? 'Wall_UnevenBrick_Door_Flat' : 'Wall_Plaster_Door_Flat';
          inserts.push(['DoorFrame_Flat_Brick', 0, 0, 0]);
          inserts.push([rng() < 0.5 ? 'Door_1_Flat' : 'Door_4_Flat', -0.6, 0, 0.0]);
          if (o.torch) inserts.push(['@props:Torch_Metal', 0.95, 1.9, 0.18]);
        } else {
          const r = rng();
          const wantWindow = r < (lvl === 0 ? 0.45 : 0.7) * o.windows;
          if (wantWindow) {
            if (rng() < 0.7) {
              wall = stone ? 'Wall_UnevenBrick_Window_Wide_Flat' : 'Wall_Plaster_Window_Wide_Flat';
              inserts.push(['Window_Wide_Flat1', 0, 0, 0]);
              if (o.shutters && rng() < 0.7) inserts.push(['WindowShutters_Wide_Flat_Open', 0, 0, 0]);
            } else {
              wall = stone ? 'Wall_UnevenBrick_Window_Thin_Round' : 'Wall_Plaster_Window_Thin_Round';
              inserts.push(['Window_Thin_Round1', 0, 0, 0]);
            }
          } else {
            wall = stone ? 'Wall_UnevenBrick_Straight' : (rng() < 0.45 ? 'Wall_Plaster_WoodGrid' : 'Wall_Plaster_Straight');
          }
          if (o.vines && lvl === 0 && !stone && rng() < 0.25) inserts.push(['Prop_Vine1', rng.range(-0.3, 0.3), 2.5, 0.12]);
          if (o.vines && lvl === 0 && stone && rng() < 0.18) inserts.push(['Prop_Vine5', rng.range(-0.2, 0.2), 2.3, 0.12]);
        }
        V(wall, [x, y, z], s.rot, 'wall');
        if (o.balcony && lvl === 1 && s.id === o.door && i === Math.floor(along / 2)) inserts.push(['Balcony_Simple_Straight', 0, 0, 0]);
        if (o.banners && lvl === o.levels - 1 && s.id === o.door && (i === 0 || i === along - 1) && along > 2) inserts.push(['@props:Banner_1', 0, 2.6, 0.12]);
        // inserts dans le repère du mur (x le long, z vers l'extérieur)
        for (const [name, lx, ly, lz] of inserts) {
          const c = Math.cos(s.rot), sn = Math.sin(s.rot);
          const wx = x + lx * c + lz * sn, wz = z - lx * sn + lz * c;
          if (name.startsWith('@props:')) P(name.slice(7), [wx, y + ly, wz], s.rot, 'wall');
          else V(name, [wx, y + ly, wz], s.rot, 'wall');
        }
      }
    }
    // poteaux d'angle
    for (const [cx, cz] of [[hw, hd], [-hw, hd], [hw, -hd], [-hw, -hd]]) V('Corner_Exterior_Wood', [cx, y, cz], 0, 'wall');
  }

  // toit + pignons
  const roofY = o.levels * LEVEL_H + 0.1;
  const lengthCells = Math.max(2, Math.min(5, o.D)) * 2;
  const roofName = o.tower ? 'Roof_Tower_RoundTiles' : roofInfo.roof + lengthCells;
  if (o.tower) { V(roofName, [0, roofY + 0.45, 0], 0, 'roof'); return pieces; }
  V(roofName, [0, roofY, 0], 0, 'roof');
  if (!o.tower) {
    V(roofInfo.gable, [0, roofY - 0.1, hd], 0, 'roof');
    V(roofInfo.gable, [0, roofY - 0.1, -hd], Math.PI, 'roof');
  }
  // cheminée sur le versant
  if (o.chimney && !o.tower) {
    const xo = rng.range(0.55, 0.8) * (hw - 0.4) * (rng() < 0.5 ? 1 : -1);
    const slope = (roofInfo.ridge + 0.52) / roofInfo.half;
    const ySurf = -0.52 + (roofInfo.half - Math.abs(xo)) * slope;
    V(rng() < 0.5 ? 'Prop_Chimney' : 'Prop_Chimney2', [xo, roofY + ySurf - 1.0, rng.range(-hd * 0.5, hd * 0.5)], 0, 'roof', { smoke: true });
  }
  return pieces;
}

/* façades de la place du marché et accessoires autour d'un bâtiment */
function houseProps(kind, rng, spec) {
  const P = (name, x, z, rot, kit = 'props') => ({ kit, name, pos: [x, 0, z], rot, part: 'prop' });
  const out = [];
  if (kind === 'house') {
    const ox = spec ? spec.W - 2 : 0, oz = spec ? spec.D - 2 : 0;   // les accessoires suivent les murs des maisons plus larges ou plus profondes
    out.push(P('Barrel', 2.9 + ox, 1.2, rng.range(0, 6.28)));
    out.push(P('Crate_Wooden', 3.2 + ox, -0.6, rng.range(0, 6.28)));
    out.push(P('Bucket_Wooden_1', 2.5 + ox, 2.3 + oz, 0));
    out.push({ kit: 'nature', name: 'Flower_3_Group', pos: [-3.0 - ox, 0, 1.6 + oz], rot: 0, part: 'prop' });
    out.push({ kit: 'nature', name: 'Bush_Common_Flowers', pos: [3.6 + ox, 0, -3.2 - oz], rot: 1.2, part: 'prop', scale: 0.8 });
  } else if (kind === 'inn') {
    out.push(P('Table_Large', 5.3, 2.2, 0.2));
    out.push(P('Bench', 5.3, 3.0, 0.2));
    out.push(P('Bench', 5.3, 1.4, 0.2));
    out.push(P('Barrel', -4.6, 2.0, 0.4)); out.push(P('Barrel', -4.9, 2.8, 2.1)); out.push(P('Barrel_Apples', -4.2, 2.9, 1.0));
    out.push(P('Chair_1', 6.6, 2.0, -1.4));
    out.push({ kit: 'village', name: 'Prop_Wagon', pos: [-7.0, 0, -1.5], rot: 0.35, part: 'prop' });
    out.push({ kit: 'village', name: 'Prop_Crate', pos: [-4.4, 0, -3.6], rot: 0.3, part: 'prop' });
  } else if (kind === 'forge') {
    out.push(P('Anvil_Log', 0.3, 1.3, 0.3));   // près de l'ouverture : on voit le forgeron frapper depuis la place
    out.push(P('Workbench', -1.2, -1.6, Math.PI / 2));
    out.push(P('Whetstone', 1.4, -1.4, 0.7));
    out.push(P('Cauldron', -2.9, 1.0, 0));
    out.push(P('Barrel', 3.0, 1.0, 0.6)); out.push(P('Crate_Wooden', 3.2, -0.5, 0.2));
    out.push(P('WeaponStand', -1.6, 1.8, -0.4));
    out.push(P('Dummy', 4.2, 3.6, 0.9));
    out.push(P('Rope_2', 2.4, 3.6, 0));
  } else if (kind === 'farm') {
    for (const [x, z, r] of [[4.4, -2.5, 0], [4.4, -0.5, 0], [4.4, 1.5, 0], [4.4, 3.5, 0], [3.4, 4.6, Math.PI / 2], [1.4, 4.6, Math.PI / 2]]) out.push(P('Prop_WoodenFence_Single', x, z, r, 'village'));
    for (const f of penFences(PENS.farm)) out.push(P('Prop_WoodenFence_Single', f[0], f[1], f[2], 'village'));   // enclos des moutons derrière la ferme
    out.push(P('FarmCrate_Carrot', 2.4, -1.6, 0.3)); out.push(P('FarmCrate_Apple', 3.2, 0.4, 1.1)); out.push(P('FarmCrate_Carrot', 2.6, 2.4, 0.5)); out.push(P('Barrel_Apples', 3.4, 3.4, 0));
    out.push({ kit: 'village', name: 'Prop_Wagon', pos: [-4.2, 0, 2.2], rot: 1.2, part: 'prop' });
    out.push(P('Bucket_Wooden_1', -3.2, -2.4, 0)); out.push(P('Bag', -3.6, -1.6, 0.4));
  } else if (kind === 'bakery') {
    out.push(P('Barrel', 3.0, 0.8, 0.3)); out.push(P('Barrel', 3.3, 1.6, 1.4)); out.push(P('Bag', 2.6, -1.2, 0)); out.push(P('Bag', 3.1, -0.6, 0.8)); out.push(P('Crate_Wooden', -3.1, 1.0, 0.4));
    out.push(P('Stall_Cart_Empty', -2.2, 3.8, Math.PI));   // l'étal du boulanger devant la boutique
  } else if (kind === 'barn') {
    out.push({ kit: 'village', name: 'Prop_Wagon', pos: [5.6, 0, 1.0], rot: 0.2, part: 'prop' });
    out.push(P('Crate_Wooden', 4.6, -2.4, 0.3)); out.push(P('Crate_Wooden', 5.3, -2.0, 0.9)); out.push(P('Barrel', -4.8, 2.2, 0.5)); out.push(P('Bag', -4.4, 3.0, 0));
    for (const f of penFences(PENS.barn)) out.push(P('Prop_WoodenFence_Single', f[0], f[1], f[2], 'village'));   // enclos des vaches derrière la grange
  } else if (kind === 'mill') {
    out.push(P('Bag', 3.0, 1.2, 0.3)); out.push(P('Bag', 3.5, 0.6, 1.2)); out.push(P('Crate_Wooden', 3.2, -1.0, 0.6)); out.push(P('Barrel', -3.0, 1.4, 0));
  } else if (kind === 'chapel' || kind === 'church') {
    // deux bancs contre la façade de part et d'autre de la porte (le clocher occupe le côté droit), un buisson à chaque bout
    const W = spec ? spec.W : 2, D = spec ? spec.D : 3, doorX = W === 2 ? 1 : 0;
    out.push(P('Bench', doorX - 2.4, D + 0.7, Math.PI)); out.push(P('Bench', doorX + 2.4, D + 0.7, Math.PI));
    out.push({ kit: 'nature', name: 'Bush_Common_Flowers', pos: [W + 4.9, 0, D - 1.0], rot: 0.4, part: 'prop', scale: 0.7 }); out.push({ kit: 'nature', name: 'Bush_Common_Flowers', pos: [-W - 1.6, 0, D + 0.9], rot: 2.1, part: 'prop', scale: 0.7 });
  } else if (kind === 'townhall') {
    out.push(P('Bench', 5.2, 1.0, Math.PI / 2)); out.push(P('Bench', -5.2, 1.0, Math.PI / 2)); out.push(P('Crate_Wooden', 5.0, -2.6, 0.3));
  } else if (kind === 'keep') {
    out.push(P('WeaponStand', 4.6, 1.2, -0.5)); out.push(P('Dummy', 5.4, 2.6, 0.8)); out.push(P('Dummy', 5.8, 0.2, 0.2)); out.push(P('Shield_Wooden', 4.4, -1.6, 0.4)); out.push(P('Barrel', -4.8, 1.0, 0)); out.push(P('Crate_Wooden', -5.0, -0.8, 0.6));
  } else if (kind === 'watchtower') {
    out.push(P('Crate_Wooden', 3.0, 0.6, 0.3)); out.push(P('Barrel', 2.8, -1.2, 0));
    out.push({ kit: 'village', name: 'Balcony_Simple_Straight', pos: [0, 2 * LEVEL_H, 2], rot: 0, part: 'wall' });   // le balcon du guetteur, au dernier étage côté route
  } else if (kind === 'market') {
    out.push(P('Stall_Empty', -2.6, 1.6, 0.35)); out.push(P('Stall_Cart_Empty', 2.8, -0.4, -2.4));
    out.push(P('FarmCrate_Apple', -2.2, 0.4, 0.3)); out.push(P('FarmCrate_Carrot', -1.4, 0.3, 0.9)); out.push(P('FarmCrate_Apple', -1.6, 0.9, 0.1));
    out.push(P('Barrel_Apples', 3.6, 1.6, 0)); out.push(P('Barrel', 4.3, 1.2, 1.1));
    out.push(P('Crate_Wooden', 0.4, -3.2, 0.4)); out.push(P('Bag', 1.3, -2.6, 0));
    out.push({ kit: 'props', name: 'Banner_2', pos: [0.12, 4.7, 0], rot: 0, part: 'prop' }); // sur le mât ajouté côté rendu
    out.push({ kit: 'village', name: 'Prop_Crate', pos: [-3.4, 0, -2.4], rot: 0.9, part: 'prop' });
  }
  return out;
}

/* ---------- disposition du village : 16 bâtiments sur le plan de la bastide (PLAN) ----------
   Les rues : la boucle autour de la place, les trois rues des portes prolongées en routes (sud → champs, ouest → pont,
   nord → forêt), la rue des maisons, l'accès du donjon et les chemins des bâtiments hors les murs jusqu'à la route. */
/* une chapelle ou une église : nef + clocher accolé à droite de la nef (côté +x local) */
function buildChapel(spec) {
  const hall = buildHouse(Object.assign({ chimney: false, vines: false, shutters: false }, spec));
  const tw = buildHouse({ W: 2, D: 2, levels: spec.towerLevels || 2, style: 'stone', tower: true, door: null, chimney: false, vines: false, shutters: false, windows: 0.3, seed: spec.seed + 1 });
  const dx = spec.W + 2;   // à droite de la nef
  for (const p of tw) { p.pos = [p.pos[0] + dx, p.pos[1], p.pos[2] + (spec.D - 2)]; hall.push(p); }
  return hall;
}
/* distance « carrée » au centre : max(|x|, |z|), la bonne mesure pour les enceintes carrées */
function sqDist(x, z) { return Math.max(Math.abs(x), Math.abs(z)); }
function makeLayout(seed = 7) {
  const rng = makeRng(seed);
  const def = (id, kind, label, spec, extra) => Object.assign({ id, kind, label, plan: PLAN[id], built: id === 'market', spec }, extra || {});
  const buildings = [
    def('market', 'market', 'Place du marché', null, { yaw: 0 }),
    def('house', 'house', 'Première maison', { W: 2, D: 2, levels: 1, door: 'S', seed: 3 }),
    def('farm', 'farm', 'Ferme', { W: 2, D: 2, levels: 1, door: 'S', seed: 21, style: 'stone', vines: false }),
    def('inn', 'inn', 'Auberge', { W: 3, D: 2, levels: 2, door: 'S', seed: 11, torch: true }),
    def('forge', 'forge', 'Forge', { W: 2, D: 2, levels: 1, door: null, seed: 5, arches: { side: 'S', cells: [0, 1] }, vines: false }),
    def('chapel', 'chapel', 'Chapelle', { W: 2, D: 3, levels: 1, door: 'S', seed: 31, towerLevels: 2 }, { chapel: true }),
    def('house2', 'house', 'Deuxième maison', { W: 2, D: 2, levels: 1, door: 'S', seed: 8 }),
    def('mill', 'mill', 'Moulin', { W: 2, D: 2, levels: 2, door: 'S', seed: 41, style: 'stone', tower: true, chimney: false, vines: false }),
    def('barn', 'barn', 'Grange', { W: 3, D: 2, levels: 1, door: null, seed: 51, style: 'stone', arches: { side: 'S', cells: [0, 1, 2] }, chimney: false, vines: false }),
    def('church', 'church', 'Église', { W: 3, D: 3, levels: 2, door: 'S', seed: 61, towerLevels: 3 }, { chapel: true }),
    def('house3', 'house', 'Troisième maison', { W: 2, D: 3, levels: 2, door: 'S', seed: 71 }),
    def('bakery', 'bakery', 'Boulangerie', { W: 2, D: 2, levels: 1, door: 'S', seed: 81 }),
    def('keep', 'keep', 'Donjon', { W: 3, D: 3, levels: 3, door: 'S', seed: 91, style: 'stone', banners: true, vines: false, chimney: false }),
    def('house4', 'house', 'Quatrième maison', { W: 3, D: 2, levels: 1, door: 'S', seed: 101 }),
    def('townhall', 'townhall', 'Hôtel de ville', { W: 3, D: 3, levels: 2, door: 'S', seed: 111, balcony: true, banners: true }),
    def('watchtower', 'watchtower', 'Tour de guet', { W: 2, D: 2, levels: 3, door: 'S', seed: 121, style: 'stone', tower: true, chimney: false, vines: false, shutters: false, windows: 0.4 }),
  ];
  for (const b of buildings) {
    const p = b.plan;
    b.pos = [p.x, terrainHeight(p.x, p.z), p.z];
    b.yaw = p.yaw;
    b.pieces = b.kind === 'market' ? [] : (b.chapel ? buildChapel(b.spec) : buildHouse(b.spec));
    b.props = houseProps(b.kind, rng, b.spec);
  }
  const byId = id => buildings.find(b => b.id === id);
  const door = (id, dist) => { const d = doorWorld(byId(id), dist); return [d.x, d.z]; };
  // les rues (polylignes au sol ; les sommets partagés relient les rues entre elles dans le graphe des trajets)
  const R = SQUARE_R, bankE = riverX(BRIDGE_Z) + 9.5, bankW = riverX(BRIDGE_Z) - 9.5;
  const paths = [];
  paths.push([[-R, -R], [0, -R], [R, -R], [R, -8], [R, R], [0, R], [-R, R], [-R, 0], [-R, -R]]);              // la rue autour de la place (sommets partagés avec les rues des portes)
  paths.push([[0, -R], [0, 0], [0, R]]); paths.push([[-R, 0], [0, 0], [R, 0]]);                                // la traversée de la place (sous les dalles)
  paths.push([[0, R], [0, HOUSE_ST_Z], [0, PAL_HALF], [0, WALL_HALF], [0, 46], [0, 56], [-4, 74], [-8, 98], [-12, 140], [-17, 190], [-22, 256]]);   // rue du sud → porte du sud → champs
  paths.push([[-R, 0], [-PAL_HALF, 0], [-WALL_HALF, 0], [bankE, BRIDGE_Z]]);                                  // rue de l'ouest → porte de l'ouest → pont
  paths.push([[bankW, BRIDGE_Z], [-72, 3], [-88, 12], [-120, 20], [-165, 30], [-210, 38], [-256, 44]]);                                                       // la route au-delà du pont
  paths.push([[0, -R], [0, -PAL_HALF], [0, -WALL_HALF], [0, -44], [4.3, -54], [6, -58], [16, -74], [24, -95], [26, -120], [32, -160], [42, -205], [52, -256]]);   // rue du nord → porte du nord → forêt
  paths.push([[0, HOUSE_ST_Z], [-30, HOUSE_ST_Z]]);                                                         // la rue des maisons
  paths.push([[R, -8], [door('keep')[0], -8], door('keep')]);                                                // l'accès du donjon
  paths.push([door('farm'), [0, 46]]);                                                                        // la ferme et la grange, de part et d'autre de la route du sud
  paths.push([door('barn'), [0, 46]]);
  paths.push([door('mill'), [door('mill')[0], -44], [0, -44]]);                                               // le moulin, à l'ouest de la route du nord
  paths.push([door('watchtower'), [4.3, -54]]);                                                               // la tour de guet, à l'est
  return { buildings, paths, pathIdx: pathIndex(paths) };
}

/* parcours d'une enceinte carrée de demi-côté `half`, par pas de `step` m : points { x, z, rot, gate }

  const sides = [
    { ax: -1, az: 1, dx: 1, dz: 0, rot: 0 },               // sud (z = +half), d'ouest en est, face vers +z
    { ax: 1, az: 1, dx: 0, dz: -1, rot: Math.PI / 2 },     // est (x = +half), du sud au nord, face vers +x
    { ax: 1, az: -1, dx: -1, dz: 0, rot: Math.PI },        // nord (z = -half), d'est en ouest, face vers -z
    { ax: -1, az: -1, dx: 0, dz: 1, rot: -Math.PI / 2 },   // ouest (x = -half), du nord au sud, face vers -x
  ];
  const out = [], n = Math.round(2 * half / step);
  for (const s of sides) for (let i = 0; i < n; i++) {
    const t = (i + 0.5) * step, x = s.ax * half + s.dx * t, z = s.az * half + s.dz * t;
    let gate = 1e9; for (const [gx, gz] of GATES) gate = Math.min(gate, Math.hypot(x - gx * half, z - gz * half));
    out.push({ x, z, rot: s.rot, nx: Math.sin(s.rot), nz: Math.cos(s.rot), gate, corner: Math.min(t, 2 * half - t) });
  }

/* palissade : piquets de bois serrés sur un carré, ouverts aux trois portes */
function palisadePieces(layout) {

  for (const p of squareWalk(PAL_HALF, 0.27)) {

    out.push({ kit: 'village', name: 'Corner_Exterior_Wood', pos: [p.x, h - 0.15, p.z], rot: p.rot, scale: 1, scaleY: 1.15 + rng() * 0.25, part: 'wall' });
  }

/* murailles : une vraie enceinte de pierre de taille (texture « rampart », plaquée en coordonnées monde par la page)
   - corps de 2 m d'épaisseur sur 6 m de haut (deux parements), chemin de ronde dallé sur le dessus,
   - parapet de 1,1 m côté extérieur surmonté de créneaux (un merlon d'un mètre par segment de 2 m),
   - talus incliné à la base, contreforts tous les 8 m, passage voûté sous chaque porte (arches de bois dehors et dedans),
   - quatre tours d'angle et une tour de garde à droite de chaque porte, de trois niveaux (le chemin de ronde les traverse).
   Toutes les faces sont des pièces du kit remises à l'échelle (scaleX / scaleY / rotX, `only` ne garde que la pierre),
   la texture monde fait que l'échelle des pierres ne bouge pas. */
const WALL_T = 2.0, WALL_H = 6.0, PARAPET_H = 1.1, MERLON_H = 0.8, PARAPET_T = 0.4, WALK_Y = WALL_H;
function wallPieces(layout) {
  const out = [], H = WALL_HALF;
  const towers = [];
  for (const sx of [-1, 1]) for (const sz of [-1, 1]) towers.push({ x: sx * H, z: sz * H, levels: 4, seed: 200 + towers.length });   // tours d'angle : 12 m
  for (const [gx, gz] of GATES) towers.push({ x: gx * H + (gx === 0 ? 4 : 0), z: gz * H + (gz === 0 ? 4 : 0), levels: 3, seed: 210 + towers.length });   // tours de porte : 9 m
  const inTower = (x, z) => towers.some(t => Math.abs(x - t.x) < 2.2 && Math.abs(z - t.z) < 2.2);
  const walk = squareWalk(H, 2.0);
  for (let i = 0; i < walk.length; i++) {

    const h = terrainHeight(p.x, p.z) - 0.1;
    if (h < RIVER.waterY + 0.5) continue;                // le mur s'arrêterait aux berges
    if (inTower(p.x, p.z)) continue;                     // segment pris dans une tour
    const c = Math.cos(p.rot), sn = Math.sin(p.rot);
    // repère du segment : lx le long du mur, lz vers l'extérieur (0 = ligne d'enceinte), ly depuis le pied
    const W = (lx, ly, lz) => [p.x + lx * c + lz * sn, h + ly, p.z - lx * sn + lz * c];
    const face = (lx, ly, lz, w, hh, yaw, extra) => out.push(Object.assign({ kit: 'village', name: 'Wall_UnevenBrick_Straight', pos: W(lx, ly, lz), rot: p.rot + yaw, scaleX: w / 2, scaleY: hh / 3, only: 'MI_UnevenBrick', mat: 'rampart', part: 'wall' }, extra || {}));
    const top = (lx, ly, lz, w, d, extra) => out.push(Object.assign({ kit: 'village', name: 'Floor_UnevenBrick', pos: W(lx, ly, lz), rot: p.rot, scaleX: w / 2, scaleZ: d / 2, mat: 'rampart', part: 'wall' }, extra || {}));
    const gate = p.gate < 2.0, gateSide = p.gate < 2.0 ? Math.sign((p.x * -p.nz + p.z * p.nx) || 1) : 0;
    // corps : parement extérieur et intérieur (6 m), ou arches de bois au rez-de-chaussée des portes
    if (gate) {
      out.push({ kit: 'village', name: 'Wall_Arch', pos: W(0, 0, 0), rot: p.rot, scale: 1, part: 'wall' });
      out.push({ kit: 'village', name: 'Wall_Arch', pos: W(0, 0, -WALL_T), rot: p.rot + Math.PI, scale: 1, part: 'wall' });

    } else {

    top(0, WALK_Y + 0.01, -(PARAPET_T + (WALL_T - PARAPET_T) / 2), 2, WALL_T - PARAPET_T, { mat: null });
    // cordon : bandeau de pierre saillant de 15 cm juste sous le parapet, côté campagne (une vraie ligne d'ombre sur toute l'enceinte)
    face(0, WALK_Y - 0.32, 0.15, 2, 0.32, 0);
    top(0, WALK_Y, 0.075, 2, 0.15); top(0, WALK_Y - 0.32, 0.075, 2, 0.15);
    // parapet et son merlon (le premier mètre du segment)
    face(0, WALK_Y, 0, 2, PARAPET_H, 0); face(0, WALK_Y, -PARAPET_T, 2, PARAPET_H, Math.PI); top(0, WALK_Y + PARAPET_H, -PARAPET_T / 2, 2, PARAPET_T);
    const mx = -0.5, my = WALK_Y + PARAPET_H;
    face(mx, my, 0, 1, MERLON_H, 0); face(mx, my, -PARAPET_T, 1, MERLON_H, Math.PI);
    face(mx + 0.5, my, -PARAPET_T / 2, PARAPET_T, MERLON_H, Math.PI / 2); face(mx - 0.5, my, -PARAPET_T / 2, PARAPET_T, MERLON_H, -Math.PI / 2);
    top(mx, my + MERLON_H, -PARAPET_T / 2, 1, PARAPET_T);
    // talus incliné au pied (sauf aux portes et sous les contreforts), contrefort tous les 8 m
    const buttress = !gate && p.gate > 3.5 && p.corner > 3.5 && (i % 4 === 2);
    if (buttress) {
      const bw = 1.2, bd = 0.8, bh = 4.6;
      face(0, 0, bd, bw, bh, 0); face(bw / 2, 0, bd / 2, bd, bh, Math.PI / 2); face(-bw / 2, 0, bd / 2, bd, bh, -Math.PI / 2);
      out.push({ kit: 'village', name: 'Floor_UnevenBrick', pos: W(0, bh + 0.4, bd / 2), rot: p.rot, rotX: Math.PI / 4, scaleX: bw / 2, scaleZ: Math.hypot(bd, bd) / 2, mat: 'rampart', part: 'wall' });   // dessus en glacis
    } else if (!gate) {

    }

    if (gate && gateSide < 0) {
      face(1, 0, -WALL_T / 2, WALL_T, 3, -Math.PI / 2); face(-3, 0, -WALL_T / 2, WALL_T, 3, Math.PI / 2);   // les deux murs du passage (4 m d'ouverture), tournés vers l'intérieur du passage
      top(-1, 3.0, -WALL_T / 2, 4, WALL_T);                                                                 // le plafond
    }
  }
  // les tours : pierre de taille sur toute la hauteur (ni poteaux ni poutres de bois), soubassement aveugle sous le sol,
  // chaînes d'angle : blocs saillants de 8 cm, alternativement longs et courts sur chaque face (vrai relief, ombre portée)
  const inBody = (x, z) => { const d = sqDist(x, z); return d > H - WALL_T - 0.02 && d < H + 0.02 && terrainHeight(x, z) - 0.1 >= RIVER.waterY + 0.5; };
  for (const t of towers) {
    const h = Math.max(terrainHeight(t.x, t.z), RIVER.waterY + 0.3) - 0.1;

    for (const p of tw) {
      if (p.name === 'Corner_Exterior_Wood') continue;

      out.push(q);

    for (const sx of [-1, 1]) for (const sz of [-1, 1]) {

        // face de normale ±z (le long de x), face de normale ±x (le long de z), et les deux petits retours

        F(cx - sx * ax, cz + sz * e / 2, e, sx > 0 ? -Math.PI / 2 : Math.PI / 2);
        F(cx + sx * e / 2, cz - sz * az, e, sz > 0 ? Math.PI : 0);

        for (const yy of [y, y + bh * 0.96]) {
          out.push({ kit: 'village', name: 'Floor_UnevenBrick', pos: [cx - sx * (ax - e) / 2, yy, cz + sz * e / 2], rot: 0, scaleX: (ax + e) / 2, scaleZ: e / 2, mat: 'rampart', part: 'wall' });
          out.push({ kit: 'village', name: 'Floor_UnevenBrick', pos: [cx + sx * e / 2, yy, cz - sz * (az - e) / 2], rot: 0, scaleX: e / 2, scaleZ: (az - e) / 2, mat: 'rampart', part: 'wall' });
        }
      }
    }
  }

}

/* ---------- la forêt : un masque 0..1 commun aux arbres, au sol de feuilles et à l'herbe ----------
   clairière autour du village et des fermes, rien au bord de l'eau ni au-dessus de la limite des arbres (≈ 170 m), un peu plus dense au nord */
function forestMask(x, z, h) {
  const r = Math.hypot(x, z);
  if (r < 55) return 0;
  let m = smooth(0.44, 0.58, fbm(x * 0.0105 + 50, z * 0.0105 + 50, 3) + 0.09 * smooth(-40, -150, z));
  m *= smooth(58, 88, r);
  m *= 1 - (1 - smooth(30, 44, Math.abs(x))) * smooth(18, 28, z) * (1 - smooth(66, 82, z));   // les champs des fermes, au sud
  m *= smooth(RIVER.halfTop + 5, RIVER.halfTop + 15, riverDist(x, z));
  if (h === undefined) h = terrainHeight(x, z);
  m *= 1 - smooth(150, 195, h);
  return m;
}

/* la forêt telle qu'elle pousse vraiment : le masque, moins les abords dégagés des bâtiments (mêmes rayons que la dispersion des arbres) */
function clearRadius(b) { return b.kind === 'market' ? 8 : (b.kind === 'mill' || b.kind === 'watchtower') ? 14 : (b.kind === 'farm' || b.kind === 'barn') ? 12 : 9; }
function forestAt(x, z, h, layout) {
  let m = forestMask(x, z, h); if (m <= 0 || !layout) return m;
  for (const b of layout.buildings) m *= smooth(clearRadius(b) + 1, clearRadius(b) + 5, Math.hypot(x - b.pos[0], z - b.pos[2]));
  return m;
}

/* ---------- forêt, herbe, rochers : positions instanciées ---------- */
function scatter(layout, seed = 3) {
  const rng = makeRng(seed);
  const occupied = layout.buildings.map(b => ({ x: b.pos[0], z: b.pos[2], r: clearRadius(b) }));   // les bâtiments hors les murs gardent leurs abords dégagés
  const free = (x, z, margin) => {
    for (const o of occupied) if (Math.hypot(x - o.x, z - o.z) < o.r + margin) return false;
    if (riverDist(x, z) < RIVER.halfTop + 1.5 + margin) return false;
    return true;
  };
  // hors de l'enceinte et de ses abords, hors des fermes de part et d'autre de la route du sud
  const outsideTown = (x, z, m) => sqDist(x, z) > WALL_HALF + 6 + m && !(Math.abs(x) < 30 + m && z > 34 && z < 58 + m);
  const trees = [], bushes = [], rocks = [], grass = [], flowers = [], pebbles = [];
  const treeTypes = ['CommonTree_1', 'CommonTree_2', 'CommonTree_3', 'CommonTree_4', 'CommonTree_5', 'Pine_1', 'Pine_2', 'Pine_3', 'Pine_4', 'Pine_5'];
  // arbres : grille jitterée (6 m près du village, 9 m au-delà de 260 m) pilotée par le masque de forêt, quelques arbres isolés dans les prés ;
  // pins en hauteur et sur les contreforts. Les plus proches de la caméra sont dessinés en vrai, les autres en imposteurs (page).
  let tries = 0;
  for (const [step, rMin, rMax] of [[4.2, 50, WORLD_HALF - 4], [7, WORLD_HALF - 4, 470]]) {
    const n = Math.ceil(rMax / step);
    for (let i = -n; i <= n; i++) for (let j = -n; j <= n; j++) for (let k = 0; k < 2; k++) {
      if (k === 1 && rng() > 0.3) continue;   // parfois un second arbre dans la case : des bouquets, pas une plantation
      const x = i * step + (rng() - 0.5) * step * 1.25, z = j * step + (rng() - 0.5) * step * 1.25;
      const sq = Math.max(Math.abs(x), Math.abs(z)); if (step === 6 ? sq > rMax : (sq <= rMin || Math.hypot(x, z) > rMax)) continue;
      const r = Math.hypot(x, z); if (r < rMin && step === 6) continue;
      const h = terrainHeight(x, z), fm = forestMask(x, z, h);
      if (rng() > fm * (0.55 + 0.6 * fbm(x * 0.09 + 5, z * 0.09 + 9, 2)) + (r < 200 ? 0.01 : 0.004)) continue;
      if (!outsideTown(x, z, 0) || !free(x, z, 1)) continue;
      if (distToPaths(x, z, layout.paths) < 4) continue;
      const nn = terrainNormal(x, z, 1.5); if (nn.y < 0.7 || h < -0.8) continue;
      const pine = rng() < smooth(8, 60, h) * 0.85 + 0.18 + 0.25 * smooth(-60, -160, z);
      const type = pine ? treeTypes[5 + rng.int(5)] : treeTypes[rng.int(5)];
      let ok = true; for (let q = trees.length - 1; q >= Math.max(0, trees.length - 120); q--) { const t = trees[q]; if (Math.abs(t.x - x) < 2.6 && Math.abs(t.z - z) < 2.6) { ok = false; break; } }
      if (!ok) continue;
      trees.push({ type, x, y: h - 0.15, z, rot: rng() * 6.28, s: rng.range(0.9, 1.25) + fm * rng.range(0, 0.35) });
    }
  }
  // quelques arbres dans le village, sur les terrains libres entre les quartiers
  for (const [x, z, s] of [[26, 13, 1.15], [25, 27, 1.0], [-26, -25, 1.2], [-27, -11, 0.95], [16, -29, 1.05], [-28, 10, 1.0]]) {
    trees.push({ type: treeTypes[rng.int(5)], x, y: terrainHeight(x, z) - 0.15, z, rot: rng() * 6.28, s });
  }
  // quelques grands arbres tordus comme repères, hors les murs (le premier abrite le camp du druide)
  for (const [x, z, s] of [[-44, 50, 0.9], [52, 22, 0.8], [-10, -70, 1.0]]) {
    if (free(x, z, 2)) trees.push({ type: 'TwistedTree_2', x, y: terrainHeight(x, z) - 0.1, z, rot: rng() * 6.28, s });
  }
  // buissons (dans le village aussi, mais pas sur la place ni le long des enceintes)
  tries = 0;
  while (bushes.length < 70 && tries++ < 8000) {
    const a = rng() * 6.28, d = 14 + Math.pow(rng(), 0.7) * 100;
    const x = Math.cos(a) * d, z = Math.sin(a) * d;
    if (!free(x, z, 0.5) || distToPaths(x, z, layout.paths) < 2.2) continue;
    const sd = sqDist(x, z); if (Math.abs(sd - PAL_HALF) < 1.8 || Math.abs(sd - WALL_HALF) < 3.2) continue;
    const h = terrainHeight(x, z); if (h < -0.6 || terrainNormal(x, z).y < 0.75) continue;
    bushes.push({ type: rng() < 0.6 ? 'Bush_Common' : 'Bush_Common_Flowers', x, y: h + 0.1, z, rot: rng() * 6.28, s: rng.range(0.7, 1.4) });
  }
  // rochers, hors les murs
  tries = 0;
  while (rocks.length < 26 && tries++ < 6000) {
    const a = rng() * 6.28, d = 36 + rng() * 100;
    const x = Math.cos(a) * d, z = Math.sin(a) * d;
    if (!free(x, z, 1) || distToPaths(x, z, layout.paths) < 2.5) continue;
    if (!outsideTown(x, z, 3)) continue;
    const h = terrainHeight(x, z);
    rocks.push({ type: 'Rock_Medium_' + (1 + rng.int(3)), x, y: h - 0.2, z, rot: rng() * 6.28, s: rng.range(0.5, 1.3) });
  }
  // galets au bord de la rivière
  tries = 0;
  while (pebbles.length < 120 && tries++ < 5000) {
    const z = rng.range(-150, 150), side = rng() < 0.5 ? -1 : 1;
    const x = riverX(z) + side * rng.range(RIVER.halfBottom + 0.5, RIVER.halfTop + 2.5);
    const h = terrainHeight(x, z);
    pebbles.push({ type: 'Pebble_Round_' + (1 + rng.int(3)), x, y: h, z, rot: rng() * 6.28, s: rng.range(0.8, 2.2) });
  }
  // l'herbe n'est plus dispersée ici : c'est un champ dense qui suit la caméra (grassDensity + GrassField dans la page)
  tries = 0;
  while (flowers.length < 0 && tries++ < 12000) {   // fleurs stylisées coupées : elles juraient avec l'herbe photo
    const a = rng() * 6.28, d = 6 + rng() * 60;
    const x = Math.cos(a) * d, z = Math.sin(a) * d;
    if (!free(x, z, -1) || distToPaths(x, z, layout.paths) < 1.8) continue;
    const h = terrainHeight(x, z); if (h < -0.6) continue;
    flowers.push({ type: rng() < 0.5 ? 'Flower_3_Group' : 'Flower_4_Group', x, y: h, z, rot: rng() * 6.28, s: rng.range(0.6, 1.0) });
  }
  return { trees, bushes, rocks, grass, flowers, pebbles };
}

/* ---------- champ d'herbe : pièces du kit, densité au sol (pur, sans Three) ----------
   Le rendu (instances qui suivent la caméra) est dans la page ; ici seulement ce qui est testable. */
const FIELD_R = 96;   // rayon du champ d'herbe autour du village (m)
// cartes d'herbe Poly Haven (Grass Bermuda 01, CC0) utilisées pour les touffes ; kit 'grass'
const FIELD_CARDS = ['dead_a', 'dead_b', 'flattened_a', 'medium_a', 'medium_b', 'medium_c', 'medium_d', 'medium_e', 'medium_f',
  'seedling_c', 'single_a', 'single_b', 'small_a', 'small_b', 'small_c', 'small_d', 'small_e', 'small_f'];
const FIELD_VARIANTS = 12;   // 0..7 : herbe verte ; 8..11 : parcelles sèches (plus de brins morts)
/* densité d'herbe 0..1 en un point : rien sur l'eau, les berges, les chemins, la place, la neige ; prairies par le bruit */
function grassDensity(x, z, h, layout) {
  const r = Math.hypot(x, z);
  if (r > FIELD_R || h < RIVER.waterY + 0.4) return 0;
  let m = 1 - smooth(FIELD_R - 16, FIELD_R, r);
  m *= smooth(RIVER.halfTop + 0.2, RIVER.halfTop + 3.5, riverDist(x, z));
  const n2 = fbm(x * 0.21 + 40, z * 0.21 + 2, 2);                       // même bruit que le bord des chemins (groundAttrib)
  m *= smooth(1.0 + n2 * 0.6, 2.4 + n2 * 1.2, layout.pathIdx ? layout.pathIdx.dist(x, z) : distToPaths(x, z, layout.paths));
  m *= smooth(SQUARE_R - 0.5, SQUARE_R + 1.5, sqDist(x, z));           // la place : terre battue
  m *= 1 - 0.45 * (1 - smooth(WALL_HALF - 3, WALL_HALF + 1, sqDist(x, z)));   // dans l'enceinte, l'herbe est piétinée
  m *= 1 - smooth(0.06, 0.45, forestAt(x, z, h, layout)) * 0.88;         // sous les arbres : sol de feuilles (même courbe que le sol)
  const meadow = fbm(x * 0.06 + 7, z * 0.06, 2);
  m *= 0.7 + 0.3 * smooth(0.3, 0.6, meadow);
  return m;
}
/* variante de touffe d'une cellule : parcelles sèches par le bruit, sinon une des variantes vertes.
   u0..u4 : nombres pseudo-aléatoires 0..1 propres à la cellule. */
function grassType(x, z, m, u0, u1, u2, u3, u4) {
  const dry = smooth(0.52, 0.7, fbm(x * 0.045 + 70, z * 0.045 + 20, 2));
  if (u3 < dry * 0.9) return 8 + Math.floor(u4 * 4);
  return Math.floor(u0 * 8);
}
/* attributs du sol par sommet, pour le shader du terrain (terrain détaillé et terrain lointain) :
   teinte relative du pré, masques chemin / sable / roche / neige / forêt, et repère des chemins (u en travers, s le long, perpendiculaire) */
function groundAttrib(x, z, h, ny, pq, layout) {
  const n1 = fbm(x * 0.05 + 3, z * 0.05 + 9, 3), n2 = fbm(x * 0.21 + 40, z * 0.21 + 2, 2), dry = fbm(x * 0.045 + 70, z * 0.045 + 20, 2);
  const r = Math.hypot(x, z), v = (0.86 + 0.28 * n1) * (1 - smooth(60, 220, r) * 0.1);
  const tint = [v * (1 + 0.16 * (dry - 0.5)), v * (1 + 0.05 * (dry - 0.5)), v * (1 - 0.25 * (dry - 0.5))];
  const dp = pq ? pq.d : 1e9;
  const path = Math.max(1 - smooth(1.2, 2.6 + n2 * 1.2, dp), 1 - smooth(SQUARE_R - 0.5, SQUARE_R + 1.5, sqDist(x, z))) * 0.95;
  const sand = 1 - smooth(RIVER.halfBottom + 0.5, RIVER.halfTop + 1.5, riverDist(x, z));
  const rock = Math.max(smooth(0.84, 0.64, ny), smooth(150, 215, h) * 0.9);
  const snow = smooth(205, 255, h + (n1 - 0.5) * 40) * (1 - smooth(0.72, 0.5, ny) * 0.7);
  const forest = smooth(0.06, 0.45, forestAt(x, z, h, layout)) * (1 - path);   // le sous-bois apparaît dès que les arbres poussent
  return { tint, path, sand, rock, snow, forest, road: pq ? [pq.u, pq.s, pq.px, pq.pz] : [0, 0, 1, 0] };
}

const COSMETIC_PIECES = ['props/Lantern_Wall', 'props/Bench', 'props/Barrel', 'props/Stool', 'props/Crate_Wooden', 'props/FarmCrate_Carrot', 'props/FarmCrate_Apple', 'props/Barrel_Apples',

/* repère local d'un bâtiment -> monde */
function bWorld(b, lx, ly, lz) {
  const c = Math.cos(b.yaw), sn = Math.sin(b.yaw);
  return [b.pos[0] + lx * c + lz * sn, b.pos[1] + ly, b.pos[2] - lx * sn + lz * c];
}
/* pièces statiques d'un cosmétique, en coordonnées monde : { kit, name, pos, rot, scale, post? } */
function cosmeticPieces(id, layout, sc) {
  const rng = makeRng(777 + id.length * 31);
  const out = [], P = (kit, name, pos, rot, scale, extra) => out.push(Object.assign({ kit, name, pos, rot, scale: scale || 1, part: 'prop' }, extra || {}));
  const mk = layout.buildings[0];
  const builtHouses = layout.buildings.filter(b => b.built && b.kind !== 'market');
  const occupied = layout.buildings.map(b => ({ x: b.pos[0], z: b.pos[2], r: b.kind === 'market' ? 8.5 : 9 }));
  const nearBuilding = (x, z, m = 0) => occupied.some(o => Math.hypot(x - o.x, z - o.z) < o.r + m);
  if (id === 'bancs') {
    for (const a of [0.7, 2.75, 4.8]) {
      const x = mk.pos[0] + Math.cos(a) * 6.3, z = mk.pos[2] + Math.sin(a) * 6.3;
      P('props', 'Bench', [x, terrainHeight(x, z), z], -a + Math.PI / 2, 1);
      const bx = mk.pos[0] + Math.cos(a + 0.42) * 6.6, bz = mk.pos[2] + Math.sin(a + 0.42) * 6.6;
      P('props', 'Barrel', [bx, terrainHeight(bx, bz), bz], rng() * 6.28, 1);
      if (a > 2) { const sx = mk.pos[0] + Math.cos(a - 0.4) * 6.5, sz = mk.pos[2] + Math.sin(a - 0.4) * 6.5; P('props', 'Stool', [sx, terrainHeight(sx, sz), sz], rng() * 6.28, 1); }
    }
  } else if (id === 'lampions') {
    for (let i = 0; i < 6; i++) {
      const a = i * Math.PI / 3 + 0.35, x = mk.pos[0] + Math.cos(a) * 7.6, z = mk.pos[2] + Math.sin(a) * 7.6, y = terrainHeight(x, z);
      P('props', 'Lantern_Wall', [x, y + 2.45, z], -a - Math.PI / 2, 1.1, { post: [x, y, z, 2.6], light: i % 2 === 0 });
    }
  } else if (id === 'lierre') {
    for (const b of builtHouses) {
      let k = 0;
      for (const p of b.pieces) {
        if (p.part !== 'wall' || !p.name.startsWith('Wall_') || p.name === 'Wall_Arch' || p.name.includes('Door')) continue;
        if (hash2(k++, b.id.length) > 0.5) continue;
        const stone = p.name.includes('UnevenBrick');
        const c = Math.cos(p.rot), sn = Math.sin(p.rot), lx = (hash2(k, 3) - 0.5) * 0.6, lz = 0.13;
        const wx = p.pos[0] + lx * c + lz * sn, wz = p.pos[2] - lx * sn + lz * c;
        P('village', stone ? (hash2(k, 5) < 0.5 ? 'Prop_Vine5' : 'Prop_Vine6') : 'Prop_Vine1', bWorld(b, wx, p.pos[1] + (stone ? 2.55 : 2.5), wz), p.rot + b.yaw, 1);
      }
    }
  } else if (id === 'lanternes') {
    for (const b of builtHouses) for (const p of b.pieces) {
      if (p.name !== 'DoorFrame_Flat_Brick') continue;
      const c = Math.cos(p.rot), sn = Math.sin(p.rot), lx = b.spec && b.spec.torch ? -1.1 : 1.1, lz = 0.16;
      const wx = p.pos[0] + lx * c + lz * sn, wz = p.pos[2] - lx * sn + lz * c;
      P('props', 'Lantern_Wall', bWorld(b, wx, p.pos[1] + 2.05, wz), p.rot + b.yaw, 1, { light: true });
    }
  } else if (id === 'fleurs') {
    for (const b of builtHouses) for (const p of b.pieces) {
      if (p.name !== 'Window_Wide_Flat1' && p.name !== 'Window_Thin_Round1') continue;
      const c = Math.cos(p.rot), sn = Math.sin(p.rot), lz = 0.3;
      const wx = p.pos[0] + lz * sn, wz = p.pos[2] + lz * c;
      P('nature', p.name === 'Window_Wide_Flat1' ? 'Flower_3_Group' : 'Flower_3_Single', bWorld(b, wx, p.pos[1] + 0.9, wz), p.rot + b.yaw + rng.range(-0.3, 0.3), 0.26);
    }
  } else if (id === 'potager') {
    for (const b of builtHouses) {
      if (!b.spec || b.kind !== 'house') continue;
      const hw = b.spec.W, hd = b.spec.D, door = b.spec.door;
      // derrière la maison ou à droite de la porte selon la place disponible (PLAN.garden) : rectangle [u0,u1] le long x, [v0,v1] le long z
      const side = (b.plan && b.plan.garden) || { S: 'E', N: 'W', E: 'N', W: 'S' }[door || 'S'];
      const gap = 1.2, depth = 4.4;
      let x0, x1, z0, z1;
      if (side === 'N') { x0 = -hw; x1 = hw; z1 = -hd - gap; z0 = z1 - depth; }
      else if (side === 'S') { x0 = -hw; x1 = hw; z0 = hd + gap; z1 = z0 + depth; }
      else if (side === 'E') { z0 = -hd; z1 = hd; x0 = hw + gap; x1 = x0 + depth; }
      else { z0 = -hd; z1 = hd; x1 = -hw - gap; x0 = x1 - depth; }
      const fence = (ax, az, bx, bz) => { const L = Math.hypot(bx - ax, bz - az), n = Math.max(1, Math.round(L / 2.06)), rot = Math.atan2(bx - ax, bz - az) + Math.PI / 2;
        for (let i = 0; i < n; i++) { const t = (i + 0.5) / n; const w = bWorld(b, lerp(ax, bx, t), 0, lerp(az, bz, t)); w[1] = terrainHeight(w[0], w[2]); P('village', 'Prop_WoodenFence_Single', w, rot + b.yaw, 1); } };
      // trois côtés (le quatrième donne sur la maison)
      if (side === 'N') { fence(x0, z0, x1, z0); fence(x0, z0, x0, z1); fence(x1, z0, x1, z1); }
      else if (side === 'S') { fence(x0, z1, x1, z1); fence(x0, z0, x0, z1); fence(x1, z0, x1, z1); }
      else if (side === 'E') { fence(x1, z0, x1, z1); fence(x0, z0, x1, z0); fence(x0, z1, x1, z1); }
      else { fence(x0, z0, x0, z1); fence(x0, z0, x1, z0); fence(x0, z1, x1, z1); }
      // récoltes à l'intérieur
      const crates = ['FarmCrate_Carrot', 'FarmCrate_Apple', 'FarmCrate_Carrot', 'Barrel_Apples', 'FarmCrate_Apple', 'FarmCrate_Carrot'];
      for (let i = 0; i < 6; i++) { const w = bWorld(b, lerp(x0 + 0.8, x1 - 0.8, (i % 3 + 0.5) / 3), 0, lerp(z0 + 0.8, z1 - 0.8, (Math.floor(i / 3) + 0.5) / 2)); w[1] = terrainHeight(w[0], w[2]); P('props', crates[i], w, rng() * 6.28, 1); }
    }
  } else if (id === 'dalles') {
    for (const path of layout.paths) for (let i = 0; i + 1 < path.length; i++) {
      const [ax, az] = path[i], [bx, bz] = path[i + 1], L = Math.hypot(bx - ax, bz - az), n = Math.floor(L / 2.3);
      for (let k = 0; k < n; k++) {
        const t = (k + 0.5) / n, x0 = lerp(ax, bx, t), z0 = lerp(az, bz, t);
        if (sqDist(x0, z0) > WALL_HALF + 14 || Math.hypot(x0 - mk.pos[0], z0 - mk.pos[2]) < 7.2) continue;
        const ang = Math.atan2(bx - ax, bz - az), side = (k % 2 ? 1 : -1) * rng.range(0.1, 0.55);
        const x = x0 + Math.cos(ang) * side, z = z0 - Math.sin(ang) * side;
        P('nature', rng() < 0.75 ? 'RockPath_Round_Wide' : 'RockPath_Round_Thin', [x, terrainHeight(x, z) + 0.02, z], ang + rng.range(-0.3, 0.3), rng.range(0.95, 1.25));
      }
    }
  } else if (id === 'haies') {
    for (const path of layout.paths) for (let i = 0; i + 1 < path.length; i++) {
      const [ax, az] = path[i], [bx, bz] = path[i + 1], L = Math.hypot(bx - ax, bz - az), n = Math.floor(L / 4.6);
      const ang = Math.atan2(bx - ax, bz - az);
      for (let k = 0; k < n; k++) for (const sgn of [-1, 1]) {
        if (hash2(k, i + sgn) < 0.35) continue;
        const t = (k + 0.5) / n, x0 = lerp(ax, bx, t), z0 = lerp(az, bz, t), off = sgn * 3.1;
        const x = x0 + Math.cos(ang) * off, z = z0 - Math.sin(ang) * off;
        if (sqDist(x, z) > WALL_HALF + 12 || nearBuilding(x, z, -1) || riverDist(x, z) < 11 || distToPaths(x, z, layout.paths) < 2.4 || Math.abs(sqDist(x, z) - PAL_HALF) < 2 || Math.abs(sqDist(x, z) - WALL_HALF) < 3) continue;
        P('nature', 'Bush_Common_Flowers', [x, terrainHeight(x, z) + 0.05, z], rng() * 6.28, rng.range(0.6, 0.95));
      }
    }
  } else if (id === 'champignons') {
    for (const t of sc.trees) {
      if (Math.hypot(t.x, t.z) > 75) continue;
      const n = 1 + (hash2(t.x, t.z) < 0.4 ? 1 : 0);
      for (let k = 0; k < n; k++) {
        const a = rng() * 6.28, bracket = rng() < 0.3, d = bracket ? 0.42 * (t.s || 1) : rng.range(1.2, 2.2), x = t.x + Math.cos(a) * d, z = t.z + Math.sin(a) * d;
        P('nature', bracket ? 'Mushroom_Laetiporus' : 'Mushroom_Common', [x, terrainHeight(x, z) + (bracket ? rng.range(0.3, 1.2) : 0), z], bracket ? -a + Math.PI / 2 : rng() * 6.28, rng.range(0.7, 1.2)); }
    }
  }
  return out;
}

/* liste des pièces à charger pour une disposition */
function requiredPieces(layout, sc) {
  const set = new Set();
  for (const b of layout.buildings) { for (const p of b.pieces) set.add(p.kit + '/' + p.name); for (const p of b.props) set.add(p.kit + '/' + p.name); }
  for (const k of ['trees', 'bushes', 'rocks', 'grass', 'flowers', 'pebbles']) for (const it of sc[k]) set.add('nature/' + it.type);
  for (const c of FIELD_CARDS) set.add('grass/grass_bermuda_01_' + c);
  for (const k of COSMETIC_PIECES) set.add(k);
  for (const p of palisadePieces(layout)) set.add(p.kit + '/' + p.name);
  for (const p of wallPieces(layout)) set.add(p.kit + '/' + p.name);
  for (const p of marketUpgradeProps(makeRng(1))) set.add(p.kit + '/' + p.name);
  for (const st of STEPS) if (st.kind === 'upgrade' && st.spec) for (const p of buildHouse(st.spec)) set.add(p.kit + '/' + p.name);
  set.add('village/Floor_UnevenBrick');
  return Array.from(set).sort();
}

  const [x0, z0, x1, z1] = r, out = [];
  for (let x = x0 + 1; x < x1; x += 2) { out.push([x, z0, 0]); out.push([x, z1, 0]); }
  for (let z = z0 + 1; z < z1; z += 2) { out.push([x0, z, Math.PI / 2]); out.push([x1, z, Math.PI / 2]); }

}

}

function buildWater(){

  zs.forEach((z, i) => { const xc = riverX(z); pos.push(xc - W, RIVER.waterY, z, xc + W, RIVER.waterY, z); uv.push(0, z / 20, 1, z / 20); if (i){ const a = (i-1)*2; idx.push(a, a+1, a+2, a+1, a+3, a+2); } });

    uniforms: THREE.UniformsUtils.merge([THREE.UniformsLib.fog, { uTime: { value: 0 }, uSun: { value: new THREE.Vector3(0, 1, 0) }, uSunColor: { value: new THREE.Color(1, 0.95, 0.85) }, uSky: { value: new THREE.Color(0.55, 0.7, 0.85) }, uDeep: { value: new THREE.Color(0.07, 0.2, 0.26) }, uShallow: { value: new THREE.Color(0.22, 0.45, 0.45) } }]),

        #include <fog_vertex>

      #include <fog_pars_fragment>
      uniform float uTime; uniform vec3 uSun, uSunColor, uSky, uDeep, uShallow; varying vec3 vW; varying vec2 vUv;
      float h(vec2 p){ return fract(sin(dot(p, vec2(127.1,311.7))) * 43758.5453); }
      float n(vec2 p){ vec2 i = floor(p), f = fract(p); vec2 u = f*f*(3.0-2.0*f);

      void main(){
        vec2 p = vW.xz;

      #endif`);
    if (up > 0) vs = vs.replace('#include <beginnormal_vertex>', `vec3 objectNormal = normalize(mix(vec3(normal), vec3(0.0, 1.0, 0.0), ${up.toFixed(2)}));

function toFloatColor(g){

  if (c.array instanceof Float32Array && c.itemSize === 4) return;
  const arr = new Float32Array(n * 4);
  for (let i = 0; i < n; i++){ arr[i*4] = c.getX(i); arr[i*4+1] = c.getY(i); arr[i*4+2] = c.getZ(i); arr[i*4+3] = c.itemSize > 3 ? c.getW(i) : 1; }

function makeGLB(jsonText, bin){

async function loadKit(kit, onProgress){
  const url = KIT + kit + '.' + GLB_EXT;

  // variante hébergée : glTF JSON avec buffer en base64 -> on reconstruit un GLB en mémoire (pas de fetch data:)
  const res = await fetch(url); if (!res.ok) throw new Error('kit ' + kit + ' introuvable (' + res.status + ')');
  const total = +res.headers.get('content-length') || 0; const reader = res.body && res.body.getReader ? res.body.getReader() : null;
  let text;
  if (reader){ const chunks = []; let got = 0; for (;;){ const { done, value } = await reader.read(); if (done) break; chunks.push(value); got += value.length; if (total) onProgress(Math.min(0.9, got / total)); }
    const all = new Uint8Array(got); let o = 0; for (const c of chunks){ all.set(c, o); o += c.length; } text = new TextDecoder().decode(all); }
  else text = await res.text();
  const js = JSON.parse(text); const uri = js.buffers[0].uri;
  const bin = b64ToBytes(uri.slice(uri.indexOf(',') + 1));
  delete js.buffers[0].uri; js.buffers[0].byteLength = bin.length;
  const glb = makeGLB(JSON.stringify(js), bin);
  return new Promise((ok, ko) => loader.parse(glb, '', ok, ko));
}
async function loadAll(onProgress){

const tmpM = new THREE.Matrix4(), tmpP = new THREE.Vector3(), tmpQ = new THREE.Quaternion(), tmpS = new THREE.Vector3();
function composeTRS(x, y, z, rotY, s){ tmpP.set(x, y, z); tmpQ.setFromAxisAngle(new THREE.Vector3(0, 1, 0), rotY); tmpS.set(s, s, s); return new THREE.Matrix4().compose(tmpP, tmpQ, tmpS); }

function addInstanced(group, key, items, opts = {}){
  const pc = pieces[key]; if (!pc || !items.length) return;
  for (const part of pc.parts){
    const im = new THREE.InstancedMesh(part.geometry, part.material, items.length);
    im.castShadow = opts.castShadow !== false; im.receiveShadow = true;
    const useColor = !!opts.tint;
    items.forEach((it, i) => {
      const m = composeTRS(it.x, it.y, it.z, it.rot, it.s || 1).multiply(part.matrix);
      im.setMatrixAt(i, m);
      if (useColor){ const c = opts.tint(it, i); im.setColorAt(i, c); }

    if (im.instanceColor) im.instanceColor.needsUpdate = true;

function buildStatic(list, originMatrix){
  const byMat = new Map();

    if (p.rotX) base.multiply(new THREE.Matrix4().makeRotationX(p.rotX));                                   // inclinaison (talus, glacis)
    if (p.scaleY || p.scaleX || p.scaleZ) base.scale(new THREE.Vector3(p.scaleX || 1, p.scaleY || 1, p.scaleZ || 1));
    for (const part of pc.parts){
      if (p.only && part.material.name !== p.only) continue;                                                 // ne garder qu'une matière de la pièce (la pierre d'un mur, sans sa poutre ni son enduit)
      const g = part.geometry.clone();
      g.applyMatrix4(new THREE.Matrix4().copy(originMatrix).multiply(base).multiply(part.matrix));
      const mat = (p.mat === 'rampart' && part.material.name === 'MI_UnevenBrick') ? getRampartMaterial() : part.material;   // la pierre de taille des murailles

/* ================= ARBRES : niveau de détail =================
   Les arbres du kit (3 000 à 6 000 triangles chacun) sont dessinés en vrai à moins de 55 m de la caméra ; au-delà, en imposteurs :
   deux plans croisés et un plan horizontal portant des images de l'arbre rendues au démarrage (de côté et de dessus), 6 triangles par arbre. */
const TreeLOD = (() => {
  const R_FULL = 55, types = []; const last = new THREE.Vector3(1e9, 0, 0); let stats = { full: 0, imp: 0 };

    const cc = new THREE.Color(); renderer.getClearColor(cc); const ca = renderer.getClearAlpha();
    renderer.setRenderTarget(rt); renderer.setClearColor(0x000000, 0); renderer.clear(); renderer.render(sceneI, cam);

    for (const part of pc.parts){ const mesh = new THREE.Mesh(part.geometry, part.material); mesh.matrixAutoUpdate = false; mesh.matrix.copy(part.matrix); sceneI.add(mesh);
      if (!part.geometry.boundingBox) part.geometry.computeBoundingBox(); box.union(part.geometry.boundingBox.clone().applyMatrix4(part.matrix)); }
    sceneI.add(new THREE.AmbientLight(0xffffff, Math.PI * 0.75)); const dl = new THREE.DirectionalLight(0xffffff, 1.4); dl.position.set(0.3, 1, 0.5); sceneI.add(dl);
    const w = Math.max(box.max.x - box.min.x, box.max.z - box.min.z), h = box.max.y - box.min.y, cx = (box.min.x + box.max.x) / 2, cz = (box.min.z + box.max.z) / 2, ym = box.min.y + h / 2;
    const cs = new THREE.OrthographicCamera(-w / 2, w / 2, h / 2, -h / 2, 0.1, 200); cs.position.set(cx, ym, cz + 80); cs.lookAt(cx, ym, cz);
    const sideTex = snapshot(sceneI, cs, 128, Math.min(512, Math.round(128 * h / w / 32) * 32 || 128));
    const ct = new THREE.OrthographicCamera(-w / 2, w / 2, w / 2, -w / 2, 0.1, 200); ct.position.set(cx, box.max.y + 40, cz); ct.up.set(0, 0, -1); ct.lookAt(cx, box.min.y, cz);
    const topTex = snapshot(sceneI, ct, 128, 128);
    // géométrie : deux plans verticaux croisés + un plan horizontal à 62 % de la hauteur ; normales vers le haut (éclairage uniforme)
    const a = new THREE.PlaneGeometry(w * 0.95, h); a.translate(cx, ym, cz); const b = new THREE.PlaneGeometry(w * 0.95, h); b.rotateY(Math.PI / 2); b.translate(cx, ym, cz);

      for (let i = 0; i < pa.count; i += 3){ for (const A of [pa, ua]){ const t = [A.getX(i + 1), A.getY(i + 1), A.itemSize > 2 ? A.getZ(i + 1) : 0]; A.setXY(i + 1, A.getX(i + 2), A.getY(i + 2)); if (A.itemSize > 2) A.setZ(i + 1, A.getZ(i + 2)); A.setXY(i + 2, t[0], t[1]); if (A.itemSize > 2) A.setZ(i + 2, t[2]); } }

  }

    const byType = {}; for (const it of trees){ (byType[it.type] = byType[it.type] || []).push(it); }
    for (const [type, items] of Object.entries(byType)){
      const key = 'nature/' + type, pc = pieces[key]; if (!pc) continue;
      const mats = items.map(it => composeTRS(it.x, it.y, it.z, it.rot, it.s || 1));
      const full = pc.parts.map(part => { const im = new THREE.InstancedMesh(part.geometry, part.material, items.length); im.castShadow = true; im.receiveShadow = true; im.frustumCulled = false; im.count = 0; group.add(im); return { im, pm: part.matrix }; });

    }

  return { init, update, get stats(){ return stats; } };
})();
function createNature(){
  const nat = new THREE.Group(); nat.name = 'nature'; scene.add(nat);
  const byType = arr => { const m = {}; for (const it of arr){ (m[it.type] = m[it.type] || []).push(it); } return m; };
  TreeLOD.init(sc.trees, nat); TreeLOD.update(camera.position, true);

/* ================= CHAMP D'HERBE =================

   Les grappes sont posées sur une grille fine de tout le pré (cellules de 0.72 m). On ne dessine que les cellules visibles,
   avec une densité qui décroît avec la distance à la caméra (toutes gardées à moins de D0 m) ; les touffes lointaines sont
   grossies pour garder la couverture, celles proches du seuil sont réduites pour éviter les apparitions brusques. Le choix est
   déterministe par cellule : l'herbe ne « bouge » pas quand la caméra se déplace. Au loin, le sol porte la même herbe cuite

    const pc = pieces['grass/grass_bermuda_01_' + rng.pick(FIELD_SETS[set])]; if (!pc) continue;
