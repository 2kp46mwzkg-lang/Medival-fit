    if (step.replaces) createStructure(step.replaces);
  }
}
/* ce que la cinématique doit montrer pour une étape : { group, box, center, chimneys } */
function performStep(step){
  if (step.kind === 'build'){
    const b = layout.buildings.find(x => x.id === step.id);
    if (b.kind === 'market') return createPlaza(false);
    b.built = true; const B = createBuilding(b);
    if (step.extra){ const e = layout.buildings.find(x => x.id === step.extra); if (e && !built[e.id]){ e.built = true; createBuilding(e); } }
    return B;
  }
  if (step.kind === 'upgrade'){
    if (step.id === 'market'){ return createPlaza(true); }
    const b = layout.buildings.find(x => x.id === step.id); b.spec0 = b.spec0 || b.spec; b.spec = step.spec; b.pieces = buildHouse(step.spec); b.upgraded = true; removeBuilding(b.id); b.built = true; return createBuilding(b);
  }
  if (step.replaces) removeStructure(step.replaces);
  return createStructure(step.id);
}
function startStep(step){
  // amélioration : l'ancien bâtiment reste debout jusqu'à l'arrivée de la caméra ; il est alors remplacé par le nouveau,
  // dont le rez-de-chaussée apparaît d'un coup (mêmes murs) et dont les étages se montent ensuite — rien n'est « détruit »
  let old = null;
  if (step.kind === 'upgrade'){ old = built[step.id] || null; if (old) delete built[step.id]; }
  const B = performStep(step);
  const box = B.box, h = box.max.y - box.min.y;
  B.group.userData.materials.forEach(m => { m.clippingPlanes = [clipPlane]; m.clipShadows = true; });
  clipPlane.constant = box.min.y + 0.02; clipScaff.constant = box.min.y + 0.02;
  cine.scaffold = null;
  if (step.kind !== 'structure'){ cine.scaffold = buildScaffold(box); scene.add(cine.scaffold); }
  const lvl0 = (old && step.id !== 'market') ? Math.min(box.min.y + LEVEL_H + 0.05, box.max.y - 1) : box.min.y;
  Object.assign(cine, { active: true, t: 0, b: B, old, lvl0, burst: false, burst2: false, h, center: B.center.clone(), r: Math.max(box.max.x - box.min.x, box.max.z - box.min.z) * 1.35 + 10, a0: cam.yaw });
  cam.locked = true; cine.camFrom = camera.position.clone(); cine.lookFrom = cam.target.clone();
  cine.label = step.label; showMsg('Construction : ' + step.label);
}
/* le remplacement de l'ancien bâtiment, dans un nuage de poussière */
function swapOld(){
  if (!cine.old) return;
  const ob = cine.old.box; disposeGroup(cine.old.group); cine.old = null;
  for (let i = 0; i < 160; i++){ const x = lerp(ob.min.x, ob.max.x, Math.random()), z = lerp(ob.min.z, ob.max.z, Math.random()), y = lerp(ob.min.y, ob.max.y, Math.random());
    Particles.spawn({ x, y, z, vx: (Math.random()-.5)*2.5, vy: .3 + Math.random()*1.2, vz: (Math.random()-.5)*2.5, c: DUST[i % 2], size: .8 + Math.random()*1.1, grow: 1.8, life: 1.4 + Math.random()*1.0, alpha: .4, drag: 1.3, lift: .2 }); }
}
const BUILD_START = 1.2, BUILD_END = 6.2, BURST_AT = 6.5, CINE_END = 10.5;
function updateBuild(dt){
  cine.t += dt; const t = cine.t, B = cine.b, box = B.box;
  // caméra : approche puis orbite lente
  const k = smooth(0, 2.2, t), a = cine.a0 + 0.9 * smooth(0, CINE_END, t);
  const r = cine.r, y = box.min.y + cine.h * 0.55 + r * 0.55;
  const target = new THREE.Vector3(Math.sin(a) * r, y, Math.cos(a) * r).add(cine.center);
  camera.position.lerpVectors(cine.camFrom, target, k);
  const look = new THREE.Vector3().lerpVectors(cine.lookFrom, cine.center, k); camera.lookAt(look);
  sun.position.copy(cine.center).addScaledVector(sunDir, 150); sun.target.position.copy(cine.center);
  const p = clamp((t - BUILD_START) / (BUILD_END - BUILD_START), 0, 1), e = p < .5 ? 2*p*p : 1 - Math.pow(-2*p+2, 2)/2;
  const level = cine.lvl0 + (box.max.y + .3 - cine.lvl0) * e;
  if (t >= BUILD_START) swapOld();
  clipPlane.constant = t < BUILD_START ? box.min.y + .02 : level;
  clipScaff.constant = Math.min(box.max.y + .5, box.min.y + (cine.h + 1.5) * clamp((t - .2) / (BUILD_END - 1.2), 0, 1) + .3);
  if (t > BUILD_START && t < BUILD_END) for (let i = 0; i < 3; i++){
    const side = Math.floor(Math.random()*4), u = Math.random(), pad = .4;
    const x = side < 2 ? lerp(box.min.x, box.max.x, u) : (side === 2 ? box.min.x - pad : box.max.x + pad);
    const z = side >= 2 ? lerp(box.min.z, box.max.z, u) : (side === 0 ? box.min.z - pad : box.max.z + pad);
    Particles.spawn({ x, y: Math.max(box.min.y + .2, level - Math.random()*.6), z, vx: (Math.random()-.5)*1.2, vy: .2 + Math.random()*.8, vz: (Math.random()-.5)*1.2, c: DUST[i % 2], size: .6 + Math.random()*.9, grow: 1.6, life: 1.2 + Math.random()*.9, alpha: .35, drag: 1.2, lift: .25 });
  }
  if (!cine.burst && t >= BURST_AT){ cine.burst = true; clipPlane.constant = 1e4;
    const c = cine.center, sx = box.max.x - box.min.x;
    for (let i = 0; i < 600; i++){ const x = lerp(box.min.x, box.max.x, Math.random()), z = lerp(box.min.z, box.max.z, Math.random()), yy = lerp(box.min.y + cine.h*.3, box.max.y, Math.random());
      const dx = x - c.x, dz = z - c.z, dl = Math.hypot(dx, dz) || 1, sp = 2.5 + Math.random()*7;
      Particles.spawn({ x, y: yy, z, vx: dx/dl*sp + (Math.random()-.5)*2, vy: 1.5 + Math.random()*4.5, vz: dz/dl*sp + (Math.random()-.5)*2, c: POWDER[i % POWDER.length], size: (1 + Math.random()*1.3) * Math.max(1, sx/9), grow: 2 + Math.random()*1.5, life: 2.4 + Math.random()*1.6, alpha: .6 + Math.random()*.3, drag: 1.7, lift: .5 }); } }
  if (!cine.burst2 && t >= BURST_AT + .4){ cine.burst2 = true; for (let i = 0; i < 220; i++){ const a2 = Math.random()*6.28, sp = 3 + Math.random()*6;
    Particles.spawn({ x: cine.center.x + (Math.random()-.5)*2, y: box.max.y + .3, z: cine.center.z + (Math.random()-.5)*2, vx: Math.cos(a2)*sp, vy: 4 + Math.random()*5, vz: Math.sin(a2)*sp, c: POWDER[(i*3) % POWDER.length], size: .9 + Math.random()*.9, grow: 2.2, life: 2.2 + Math.random()*1.2, alpha: .55 + Math.random()*.3, drag: 1.5, lift: -.4 }); } }
  if (t >= BURST_AT && cine.scaffold){ const f = clamp((t - BURST_AT) / .9, 0, 1); cine.scaffold.userData.mat.opacity = 1 - f; cine.scaffold.position.y = -f * .9; if (f >= 1) cine.scaffold.visible = false; }
  if (t >= CINE_END) finishBuild(false);
}
function finishBuild(skipped){
  cine.active = false; clipPlane.constant = 1e4; clipScaff.constant = 1e4;
  if (cine.old){ disposeGroup(cine.old.group); cine.old = null; }
  if (cine.scaffold){ scene.remove(cine.scaffold); cine.scaffold = null; }
  cine.b.group.userData.materials.forEach(m => { m.clippingPlanes = null; });
  // on rend la main à la caméra là où elle est
  cam.locked = false;
  cam.target.copy(cine.center); cam.target.y = terrainHeight(cam.target.x, cam.target.z);
  const d = camera.position.clone().sub(cam.target); cam.dist = clamp(d.length(), 5, 125); cam.yaw = Math.atan2(d.x, d.z); cam.pitchOff = 0;
  applyCamera();
  showMsg((cine.label || 'Construction') + ' : terminé !');
  Cosmetics.onBuilding(); Population.sync();
  Progress.render();
}

/* ================= LA VIE DU VILLAGE : HABITANTS ET ANIMAUX =================
   Personnages : Universal Base Characters + Modular Character Outfits + Universal Animation Library (Quaternius, CC0).
   Animaux : Ultimate Animated Animal Pack + Farm Animals 2018 (Quaternius, CC0). Poules et canards : maillages faits ici. */

/* ---- fabrique de personnages ---- */
const People = (() => {
  const parts = {}, templates = {}, clips = {}, pelvisZ = {}, boneMap = {};
  let ready = false;
  function init(gltf){
    const ex = (gltf.parser.json.extras) || {}; Object.assign(pelvisZ, ex.pelvisZ || {});
    gltf.scene.traverse(o => {
      if (!o.isSkinnedMesh) return;
      const key = (o.parent && o.parent.isGroup && o.parent.name && o.name.startsWith(o.parent.name + '_')) ? o.parent.name : o.name;
      (parts[key] = parts[key] || []).push({ geometry: o.geometry, material: o.material, jointNames: o.skeleton.bones.map(b => b.name), ibms: o.skeleton.boneInverses.map(m => m.clone()) });
    });
    for (const root of gltf.scene.children){
      const sex = root.name === 'Skeleton_M' ? 'M' : root.name === 'Skeleton_F' ? 'F' : null; if (!sex) continue;
      const t = root.clone(false); for (const c of root.children) if (c.isBone || (!c.isSkinnedMesh && !c.isGroup)) t.add(c.clone(true));
      templates[sex] = t;
    }
    const lm = [], lf = []; templates.M.traverse(o => lm.push(o.name)); templates.F.traverse(o => lf.push(o.name));
    boneMap.F = {}; boneMap.M = {}; lm.forEach((n, i) => { boneMap.F[n] = lf[i]; boneMap.M[n] = n; });
    for (const c of gltf.animations) clips[c.name] = c;
    // matériaux : peau et tenues réagissent à la lumière comme le reste du village
    for (const list of Object.values(parts)) for (const p of list){ p.material.roughness = 0.85; p.material.metalness = 0; p.material.side = THREE.FrontSide; if (p.material.name.startsWith('Hair')) p.material.side = THREE.DoubleSide; }
    ready = true;
  }
  function clipFor(name, sex){
    const c = clips[name]; if (!c) return null;
    if (sex === 'M') return c;
    const key = name + '/' + sex; if (clips[key]) return clips[key];
    const k = (pelvisZ[sex] || 1) / (pelvisZ.M || 1), cl = c.clone();
    for (const tr of cl.tracks){
      const dot = tr.name.lastIndexOf('.'), bone = tr.name.slice(0, dot), prop = tr.name.slice(dot);
      tr.name = (boneMap[sex][bone] || bone) + prop;
      if (bone === 'pelvis' && prop === '.position'){ for (let i = 0; i < tr.values.length; i++) tr.values[i] *= k; }
    }
    clips[key] = cl; return cl;
  }
  const HAIR_COLORS = [[0.22, 0.14, 0.09], [0.45, 0.28, 0.14], [0.12, 0.09, 0.08], [0.78, 0.6, 0.32], [0.55, 0.3, 0.16], [0.62, 0.6, 0.58]];
  const CLOTH = [[1, 1, 1], [0.78, 0.86, 1.0], [1.0, 0.82, 0.74], [0.82, 1.0, 0.82], [1.0, 0.95, 0.72], [0.9, 0.78, 1.0], [0.85, 0.85, 0.85]];
  function make(spec){
    const sex = spec.sex || 'M', rng = makeRng((spec.seed || 1) * 131 + 7);
    const root = new THREE.Group(); root.name = 'person';
    const skel = SkeletonUtils.clone(templates[sex]); root.add(skel);
    const bones = {}; skel.traverse(o => { if (o !== skel) bones[o.name] = o; });
    const mats = {}; const meshes = [];
    const add = (name, tint) => {
      const list = parts[name]; if (!list) return null;
      for (const p of list){
        const key = p.material.name; let mat = mats[key]; if (!mat){ mat = p.material.clone(); mats[key] = mat; }
        if (tint) mat.color.setRGB(tint[0], tint[1], tint[2]);
        const mesh = new THREE.SkinnedMesh(p.geometry, mat);
        const bl = p.jointNames.map(n => bones[n] || bones[(boneMap[sex] || {})[n]]);
        if (bl.some(b => !b)) { console.warn('os manquant pour', name); continue; }
        mesh.bind(new THREE.Skeleton(bl, p.ibms), new THREE.Matrix4());
        mesh.castShadow = /_(peasant|ranger|head)/.test(name); mesh.receiveShadow = true; mesh.frustumCulled = false;
        mesh.userData.detail = /_(eyes|brows)$/.test(name);
        root.add(mesh); meshes.push(mesh);
      }
    };
    const hairTint = spec.hairTint || HAIR_COLORS[rng.int(HAIR_COLORS.length)];
    const cloth = spec.cloth || CLOTH[rng.int(CLOTH.length)];
    add(sex + '_' + (spec.outfit || 'peasant'), spec.outfit === 'ranger' ? [0.95, 0.95, 0.95] : cloth);
    add(sex + '_head'); add(sex + '_eyes'); add(sex + '_brows', hairTint);
    if (spec.hair) add(spec.hair, hairTint);
    if (spec.beard) add('Hair_Beard', hairTint);
    if (spec.scale) root.scale.setScalar(spec.scale);
    const mixer = new THREE.AnimationMixer(root);
    const person = { root, mixer, bones, sex, meshes, cur: null, curName: null,
      play(name, opts = {}){
        if (person.curName === name && !opts.restart) return person.cur;
        const c = clipFor(name, sex); if (!c) { console.warn('clip absent', name); return null; }
        const a = mixer.clipAction(c); const fade = opts.fade === undefined ? 0.25 : opts.fade;
        if (person.cur && person.cur !== a) person.cur.fadeOut(fade);
        a.enabled = true; a.setEffectiveTimeScale(opts.speed || 1); a.setEffectiveWeight(1);
        if (opts.once){ a.setLoop(THREE.LoopOnce, 1); a.clampWhenFinished = true; } else a.setLoop(THREE.LoopRepeat, Infinity);
        a.reset().fadeIn(fade).play(); if (opts.time) a.time = opts.time;
        person.cur = a; person.curName = name; return a;
      },
      duration(name){ const c = clips[name]; return c ? c.duration : 1; },
      attach(obj, boneName){ const b = bones[boneName] || bones[(boneMap[sex] || {})[boneName]]; if (b) b.add(obj); return b; },
      setVisible(v){ root.visible = v; },
    };
    return person;
  }
  return { init, make, clips, parts, get ready(){ return ready; } };
})();

/* ---- fabrique d'animaux ---- */
const Fauna = (() => {
  const templates = {}, clips = {}; let ready = false;
  const HEIGHT = { cow: 1.45, bull: 1.55, horse: 1.65, donkey: 1.25, deer: 1.25, stag: 1.5, fox: 0.45, dog: 0.55, sheep: 0.9, pig: 0.75 };
  const fit = {};
  function init(gltf){
    for (const r of gltf.scene.children) templates[r.name] = r;
    for (const c of gltf.animations) clips[c.name] = c;
    for (const [name, t] of Object.entries(templates)){
      t.traverse(o => { if (o.isMesh){ o.castShadow = true; o.receiveShadow = true; o.frustumCulled = false; if (o.material){ o.material.roughness = 0.9; o.material.metalness = 0; } } });
      t.updateMatrixWorld(true);
      const box = new THREE.Box3().setFromObject(t, true); const h = box.max.y - box.min.y;
      fit[name] = { k: (HEIGHT[name] || 1) / h, y: -box.min.y * ((HEIGHT[name] || 1) / h) };
    }
    ready = true;
  }
  function make(species, tint){
    const t = templates[species]; if (!t) return null;
    const obj = SkeletonUtils.clone(t); const root = new THREE.Group(); root.name = species; root.add(obj);
    obj.scale.setScalar(fit[species].k); obj.position.y = fit[species].y;
    if (tint){ obj.traverse(o => { if (o.isMesh && o.material && o.material.name === 'Main'){ o.material = o.material.clone(); o.material.color.multiply(new THREE.Color(tint[0], tint[1], tint[2])); } }); }
    const mixer = new THREE.AnimationMixer(obj);
    const a = { root, obj, mixer, species, cur: null, curName: null,
      play(name, opts = {}){ if (a.curName === name) return a.cur; const c = clips[species + '/' + name]; if (!c) return null; const act = mixer.clipAction(c); if (a.cur && a.cur !== act) a.cur.fadeOut(0.3);
        act.enabled = true; act.setEffectiveWeight(1); act.setEffectiveTimeScale(opts.speed || 1); act.setLoop(THREE.LoopRepeat, Infinity); act.reset().fadeIn(0.3).play(); if (opts.time) act.time = opts.time; a.cur = act; a.curName = name; return act; },
      has(name){ return !!clips[species + '/' + name]; }, duration(name){ const c = clips[species + '/' + name]; return c ? c.duration : 1; } };
    return a;
  }
  return { init, make, get ready(){ return ready; }, HEIGHT };
})();

/* ---- poules, coq, canards : petits maillages faits ici (deux maillages par oiseau : corps et tête, couleurs aux sommets) ---- */
const Birds = (() => {
  const mat = new THREE.MeshStandardMaterial({ vertexColors: true, roughness: 0.9 });
  function colored(geo, c){ const n = geo.attributes.position.count; const arr = new Float32Array(n * 3); for (let i = 0; i < n; i++){ arr[i*3] = c[0]; arr[i*3+1] = c[1]; arr[i*3+2] = c[2]; } geo.setAttribute('color', new THREE.BufferAttribute(arr, 3)); return geo; }
  const T = (geo, x, y, z, rx = 0, ry = 0, rz = 0, sx = 1, sy = 1, sz = 1) => { const m = new THREE.Matrix4().compose(new THREE.Vector3(x, y, z), new THREE.Quaternion().setFromEuler(new THREE.Euler(rx, ry, rz)), new THREE.Vector3(sx, sy, sz)); geo.applyMatrix4(m); return geo; };
  const sphere = (r, c, x, y, z, sx = 1, sy = 1, sz = 1, rx = 0) => T(colored(new THREE.SphereGeometry(r, 9, 7), c), x, y, z, rx, 0, 0, sx, sy, sz);
  const box = (w, h, d, c, x, y, z) => T(colored(new THREE.BoxGeometry(w, h, d), c), x, y, z);
  const cone = (r, h, c, x, y, z, rx) => T(colored(new THREE.ConeGeometry(r, h, 6), c), x, y, z, rx);
  function mesh(geos){ const g = BufferGeometryUtils.mergeGeometries(geos, false); const m = new THREE.Mesh(g, mat); m.castShadow = true; return m; }
  const ORANGE = [0.95, 0.65, 0.15], RED = [0.85, 0.12, 0.1];
  function chicken(variant){
    const col = [[0.78, 0.6, 0.38], [0.92, 0.9, 0.86], [0.25, 0.2, 0.18], [0.72, 0.45, 0.28]][variant % 4];
    const g = new THREE.Group();
    const body = [sphere(0.17, col, 0, 0.22, 0, 1, 0.85, 1.25), sphere(0.09, col, 0, 0.32, -0.2, 0.6, 1.2, 1, -0.6)];
    for (const sx of [-1, 1]){ body.push(box(0.02, 0.12, 0.02, ORANGE, sx * 0.06, 0.06, 0.02)); body.push(box(0.06, 0.012, 0.08, ORANGE, sx * 0.06, 0.006, 0.05)); }
    g.add(mesh(body));
    const head = new THREE.Group(); head.position.set(0, 0.3, 0.14); g.add(head);
    head.add(mesh([sphere(0.06, col, 0, 0.07, 0.03, 1, 1.6, 1), sphere(0.075, col, 0, 0.17, 0.06), cone(0.03, 0.07, ORANGE, 0, 0.16, 0.14, Math.PI / 2), box(0.02, 0.06, 0.08, RED, 0, 0.25, 0.05), sphere(0.02, RED, 0, 0.12, 0.11)]));
    g.userData.head = head; return g;
  }
  function rooster(){
    const col = [0.25, 0.2, 0.18]; const g = new THREE.Group(); g.scale.setScalar(1.25);
    const body = [sphere(0.17, col, 0, 0.22, 0, 1, 0.85, 1.25), sphere(0.09, col, 0, 0.32, -0.2, 0.6, 1.2, 1, -0.6), sphere(0.12, [0.1, 0.35, 0.3], 0, 0.38, -0.28, 0.5, 1.4, 1, -0.9), sphere(0.08, [0.6, 0.15, 0.1], 0, 0.42, -0.2, 0.5, 1.3, 1, -1.1)];
    for (const sx of [-1, 1]){ body.push(box(0.02, 0.12, 0.02, ORANGE, sx * 0.06, 0.06, 0.02)); body.push(box(0.06, 0.012, 0.08, ORANGE, sx * 0.06, 0.006, 0.05)); }
    g.add(mesh(body));
    const head = new THREE.Group(); head.position.set(0, 0.3, 0.14); g.add(head);
    head.add(mesh([sphere(0.06, col, 0, 0.07, 0.03, 1, 1.6, 1), sphere(0.075, col, 0, 0.17, 0.06), cone(0.03, 0.07, ORANGE, 0, 0.16, 0.14, Math.PI / 2), box(0.025, 0.1, 0.12, RED, 0, 0.27, 0.05), sphere(0.03, RED, 0, 0.11, 0.11)]));
    g.userData.head = head; return g;
  }
  function duck(male){
    const body = male ? [0.6, 0.55, 0.5] : [0.55, 0.45, 0.33], headC = male ? [0.1, 0.4, 0.2] : [0.5, 0.4, 0.3];
    const g = new THREE.Group();
    g.add(mesh([sphere(0.17, body, 0, 0.09, 0, 1, 0.65, 1.35), sphere(0.06, body, 0, 0.14, -0.22, 0.8, 0.6, 1.2, -0.5)]));
    const head = new THREE.Group(); head.position.set(0, 0.14, 0.14); g.add(head);
    const hg = [sphere(0.05, headC, 0, 0.06, 0.02, 1, 1.8, 1), sphere(0.075, headC, 0, 0.17, 0.05), box(0.07, 0.025, 0.1, ORANGE, 0, 0.15, 0.13)];
    if (male) hg.push(T(colored(new THREE.TorusGeometry(0.052, 0.012, 6, 12), [0.95, 0.95, 0.95]), 0, 0.095, 0.03, Math.PI / 2));
    head.add(mesh(hg));
    g.userData.head = head; return g;
  }
  return { chicken, rooster, duck };
})();

/* ---- accessoires tenus en main (procéduraux ou pièces du kit) ---- */
const Props = (() => {
  const wood = () => new THREE.MeshStandardMaterial({ color: 0x8a6a45, roughness: 0.9 });
  const iron = () => new THREE.MeshStandardMaterial({ color: 0x5a5c60, roughness: 0.55, metalness: 0.6 });

      const o = ag.root, head = o.userData.head;
      if (ag.role === 'duck'){
        // dérive lente sur l'eau, bob, parfois la tête sous l'eau
        ag.stateT -= dt; if (ag.stateT <= 0){ ag.state = ag.state === 0 ? 1 : 0; ag.stateT = ag.state ? rnd(1.5, 3) : rnd(4, 9); ag.turn = rnd(-1, 1); }

        const rx = riverX(o.position.z); const off = o.position.x - rx; if (Math.abs(off) > RIVER.halfBottom - 1.5) ag.yaw += Math.PI * 0.5 * dt * Math.sign(-off);
        const dz = o.position.z - ag.cz; if (Math.abs(dz) > 9) ag.yaw = Math.atan2(rx - o.position.x, ag.cz - o.position.z);
        o.rotation.y = ag.yaw; o.position.y = RIVER.waterY + 0.02 + Math.sin(ag.t * 2.1) * 0.025; o.rotation.z = Math.sin(ag.t * 1.7) * 0.05;
        head.rotation.x = ag.state === 1 ? Math.min(1.3, head.rotation.x + dt * 4) : Math.max(0, head.rotation.x - dt * 4);
      } else {
        // poule : marche, s'arrête, picore
        ag.stateT -= dt; if (ag.stateT <= 0){ ag.state = (ag.state + 1) % 3; ag.stateT = ag.state === 0 ? rnd(1, 3) : ag.state === 1 ? rnd(1.5, 3) : rnd(2, 4); ag.turn = rnd(-1.5, 1.5); }
        if (ag.state === 0){ ag.yaw += ag.turn * dt; const sp = 0.45; o.position.x += Math.sin(ag.yaw) * sp * dt; o.position.z += Math.cos(ag.yaw) * sp * dt; const dx = o.position.x - ag.cx, dz = o.position.z - ag.cz; if (Math.hypot(dx, dz) > ag.r) ag.yaw = Math.atan2(-dx, -dz) + rnd(-0.4, 0.4); o.position.y = groundY(o.position.x, o.position.z); o.rotation.y = ag.yaw; o.rotation.z = Math.sin(ag.t * 14) * 0.08; head.rotation.x = 0.15 + Math.sin(ag.t * 14) * 0.15; }
        else if (ag.state === 2){ o.rotation.z = 0; head.rotation.x = (Math.sin(ag.t * 9) > 0.3 ? 1.05 : 0.2); }
        else { o.rotation.z = 0; head.rotation.x += (0 - head.rotation.x) * Math.min(1, dt * 6); o.rotation.y = ag.yaw + Math.sin(ag.t * 0.8) * 0.3; }

    }
    if (ag.staticAnim){ const o = ag.root; const g = Math.sin(ag.t * 0.9 + ag.phase); o.rotation.x = g > 0.6 ? -0.16 : 0; o.position.y = groundY(o.position.x, o.position.z) + (g > 0.6 ? -0.02 : 0); ag.stateT -= dt; if (ag.stateT <= 0){ ag.stateT = rnd(6, 14); ag.yaw += rnd(-0.8, 0.8); } o.rotation.y += (ag.yaw - o.rotation.y) * Math.min(1, dt * 1.5); return; }
    // animaux animés : idles, et pour les enclos une petite marche vers un autre coin
    ag.stateT -= dt;
    if (ag.state === 1){ const p = ag.root.position, t = ag.walkTo; const dx = t[0] - p.x, dz = t[1] - p.z, d = Math.hypot(dx, dz);

      const want = Math.atan2(dx, dz); let dy = want - ag.yaw; dy = Math.atan2(Math.sin(dy), Math.cos(dy)); ag.yaw += clamp(dy, -2 * dt, 2 * dt); ag.root.rotation.y = ag.yaw;
      const sp = ag.species === 'fox' ? 2.2 : 0.7; p.x += Math.sin(ag.yaw) * sp * dt; p.z += Math.cos(ag.yaw) * sp * dt; p.y = groundY(p.x, p.z); return; }
    if (ag.stateT <= 0){
      if (ag.penSpots && Math.random() < 0.5 && ag.anim.has('Walk')){ ag.state = 1; ag.walkTo = ag.penSpots[Math.floor(Math.random() * ag.penSpots.length)]; ag.anim.play('Walk', { speed: 0.9 }); ag.stateT = 30; }
      else if (ag.loop && ag.anim.has('Walk')){ ag.state = 1; ag.loopI = ((ag.loopI || 0) + 1) % ag.loop.length; ag.walkTo = ag.loop[ag.loopI]; ag.anim.play(ag.species === 'fox' ? 'Gallop' : 'Walk', { speed: ag.species === 'fox' ? 1.2 : 0.9 }); ag.stateT = 60; }
      else animalIdle(ag);

  }

  /* --- ce qui doit exister d'après les bâtiments construits --- */
  function desired(){
    const want = {};
    const addHumans = (ownerKey, list, building) => list.forEach((h, i) => { want[ownerKey + ':h' + i] = { kind: 'human', spec: h, building }; });
    const addAnimals = (ownerKey, list, building) => list.forEach((a, i) => {
      if (a.n){ for (let k = 0; k < a.n; k++){
        if (a.kind === 'chicken'){ const w = bWorld(building, a.around[0], 0, a.around[1]); want[ownerKey + ':a' + i + '_' + k] = { kind: 'animal', spec: { kind: k === 0 ? 'rooster' : 'chicken', variant: k, cx: w[0], cz: w[2], r: a.r }, building }; }
        else if (a.kind === 'duck'){ const z = BRIDGE_Z + 3 + (k - 1) * 4.5; want[ownerKey + ':a' + i + '_' + k] = { kind: 'animal', spec: { kind: 'duck', male: k === 0, cx: riverX(z) + (k - 1) * 2.2, cz: z }, building }; }
        else want[ownerKey + ':a' + i + '_' + k] = { kind: 'animal', spec: Object.assign({}, a), building }; } }
      else if (a.spot){ const sw = spotWorld(building, { x: a.spot[0], z: a.spot[1], look: a.look }); want[ownerKey + ':a' + i] = { kind: 'animal', spec: Object.assign({ spotWorld: sw }, a), building }; }
      else want[ownerKey + ':a' + i] = { kind: 'animal', spec: Object.assign({}, a), building };
    });
    for (const [id, def] of Object.entries(PEOPLE)){
      if (id === 'walls' || id === 'palisade' || id === 'bridge'){ if (!structures[id]) continue; if (def.humans) addHumans(id, def.humans, null); if (def.animals) addAnimals(id, def.animals, null); continue; }
      if (id === 'druid'){ if (!built.chapel) continue; addHumans('druid', def.humans, null);
        const st = { kind: 'stag', x: camp.x + 4.5, z: camp.z - 3.5, yaw: Math.atan2(camp.x - (camp.x + 4.5), camp.z - (camp.z - 3.5)) }; want['druid:stag'] = { kind: 'animal', spec: st, building: null }; continue; }
      const b = built[id] && built[id].b; if (!b) continue;
      if (def.humans) addHumans(id, def.humans, b);
      if (def.animals) addAnimals(id, def.animals, b);
    }
    // faune sauvage : biches en lisière, renard la nuit (toujours "désirées", visibles selon l'heure)
    for (const [i, a] of WILD.entries()) want['wild:' + i] = { kind: 'animal', spec: a, building: null };
    return want;
  }
  let WILD = [];
  function wildSpots(){
    const pick = (ang, r) => { for (let k = 0; k < 20; k++){ const a = ang + (k - 10) * 0.05, x = Math.cos(a) * r, z = Math.sin(a) * r; if (riverDist(x, z) > 14 && terrainHeight(x, z) > -0.3 && terrainHeight(x, z) < 12) return [x, z]; } return [Math.cos(ang) * r, Math.sin(ang) * r]; };
    const d1 = pick(0.35, 54), d2 = pick(4.4, 56), f = [];
    for (let i = 0; i < 8; i++){ const a = 5.2 + i * 0.22; f.push(pick(a, 47)); }
    WILD = [{ kind: 'deer', x: d1[0], z: d1[1], yaw: Math.random() * 6.28, loop: [d1, [d1[0] + 6, d1[1] + 2], [d1[0] + 2, d1[1] + 7]], role: 'deer' },
            { kind: 'deer', x: d2[0], z: d2[1], yaw: Math.random() * 6.28, loop: [d2, [d2[0] - 5, d2[1] + 4], [d2[0] + 3, d2[1] + 6]], role: 'deer' },
            { kind: 'fox', x: f[0][0], z: f[0][1], yaw: 0, loop: f, role: 'fox' }];
  }

  function sync(){
    if (!People.ready || !Fauna.ready) return;
    const want = desired();
    for (const [k, ag] of agents){ if (!want[k]){ group.remove(ag.root); ag.root.traverse(o => { if (o.isSkinnedMesh && o.skeleton) o.skeleton.dispose && o.skeleton.dispose(); }); agents.delete(k); } }
    for (const [k, w] of Object.entries(want)){
      if (agents.has(k)) continue;
      const ag = w.kind === 'human' ? makeHuman(k, w.spec, w.building) : makeAnimal(k, w.spec, w.building);
      if (ag){ if (ag.spec && ag.spec.loop){ ag.loop = ag.spec.loop; ag.loopI = 0; } agents.set(k, ag); }
    }
    applyHour();
  }
  function applyHour(){
    for (const ag of agents.values()){
      const role = ag.kind === 'human' ? ag.spec.role : ag.role;
      const on = activeAt(role, hour); ag.root.visible = on;
      if (ag.kind === 'human' && (role === 'guard' || role === 'doorguard')){ const night = hour >= 19.5 || hour < 6.5; if (night && ag.propName !== 'torch') setProp(ag, 'torch'); else if (!night && ag.propName === 'torch') setProp(ag, 'halberd'); if (ag.prop && ag.prop.userData.light) ag.prop.userData.light.intensity = night ? 6 : 0; }
    }
    if (cauldron) cauldron.fireOn = true;
  }
  function onHour(h){ hour = h; applyHour(); }

  /* --- le camp du druide : chaudron et feu --- */
  let cauldron = null;
  function makeCamp(){
    camp = druidCamp(sc);
    const g = new THREE.Group(); g.position.set(camp.x, groundY(camp.x, camp.z), camp.z);
    const c = Props.sack; // (placeholder pour garder la structure)
    const caul = (function(){ const pc = pieces['props/Cauldron']; const gg = new THREE.Group(); if (pc) for (const part of pc.parts){ const m = new THREE.Mesh(part.geometry, part.material); m.applyMatrix4(part.matrix); m.castShadow = true; m.receiveShadow = true; gg.add(m); } return gg; })();
    caul.scale.setScalar(1.15); g.add(caul);
    // bûches
    for (let i = 0; i < 5; i++){ const log = new THREE.Mesh(new THREE.CylinderGeometry(0.06, 0.07, 0.9, 6), new THREE.MeshStandardMaterial({ color: 0x5a3d26, roughness: 1 })); log.rotation.z = Math.PI / 2; log.rotation.y = i * 1.25; log.position.set(0, 0.07, 0); g.add(log); }
    const light = new THREE.PointLight(0x7fff9a, 4, 9, 2); light.position.set(0, 0.9, 0); g.add(light);
    // pierres autour
    for (let i = 0; i < 7; i++){ const a = i / 7 * 6.28, r = 2.4 + Math.random() * 0.5; const st = new THREE.Mesh(new THREE.DodecahedronGeometry(0.22 + Math.random() * 0.1), new THREE.MeshStandardMaterial({ color: 0x777a74, roughness: 1 })); st.position.set(Math.cos(a) * r, 0.1 + (groundY(camp.x + Math.cos(a) * r, camp.z + Math.sin(a) * r) - g.position.y), Math.sin(a) * r); st.castShadow = true; g.add(st); }
    group.add(g); cauldron = { group: g, light, fireOn: true, t: 0 };
    GrassField.clearBox(new THREE.Box3(new THREE.Vector3(camp.x - 3.2, -5, camp.z - 3.2), new THREE.Vector3(camp.x + 3.2, 5, camp.z + 3.2)), 0);
  }
  function updateCamp(dt){
    if (!cauldron || !built.chapel) { if (cauldron) cauldron.group.visible = false; return; }
    cauldron.group.visible = true; cauldron.t += dt;
    cauldron.light.intensity = 3.5 + Math.sin(cauldron.t * 9) * 0.8 + Math.sin(cauldron.t * 23) * 0.4;
    if (Math.random() < dt * 30){ const p = cauldron.group.position; Particles.spawn({ x: p.x + (Math.random() - .5) * .5, y: p.y + 0.5 + Math.random() * 0.3, z: p.z + (Math.random() - .5) * .5, vx: (Math.random() - .5) * .3, vy: .8 + Math.random() * .8, vz: (Math.random() - .5) * .3, c: Math.random() < 0.4 ? [.5, 1, .55] : [.75, .78, .7], size: .25 + Math.random() * .3, grow: 2.2, life: 1.4 + Math.random() * 1.2, alpha: .45, drag: .8, lift: .5 }); }
  }

  function init(){ graph = pathGraph(layout.paths); makeCamp(); wildSpots(); }
  function update(dt){
    frame++;
    const ct = cam.target;
    for (const ag of agents.values()){
      if (!ag.root.visible) continue;
      const d = Math.hypot(ag.root.position.x - ct.x, ag.root.position.z - ct.z);
      // niveau de détail : loin, on anime moins souvent ; très loin, on cache
      const far = d > 150; if (far){ ag.root.visible = false; ag.hiddenByLod = true; continue; }
      const every = d < 55 ? 1 : d < 100 ? 2 : 4; if (frame % every) continue;
      if (ag.kind === 'human' && frame % 15 === 0){ const near = d < 40; for (const m of ag.person.meshes) if (m.userData.detail) m.visible = near; }
      const ddt = dt * every;
      if (ag.kind === 'human'){ updateAgent(ag, ddt); ag.person.mixer.update(ddt); }
      else { updateAnimal(ag, ddt); if (ag.anim) ag.anim.mixer.update(ddt); }
    }
    if (frame % 30 === 0) for (const ag of agents.values()) if (ag.hiddenByLod){ const d = Math.hypot(ag.root.position.x - ct.x, ag.root.position.z - ct.z); if (d < 140){ ag.hiddenByLod = false; ag.root.visible = activeAt(ag.kind === 'human' ? ag.spec.role : ag.role, hour); } }
    updateCamp(dt);
  }
  function stats(){ let h = 0, a = 0; for (const ag of agents.values()){ if (ag.kind === 'human') h++; else a++; } return { humans: h, animals: a }; }
  /* outils de mise au point : forcer l'étape d'un agent */
  function debugStep(key, i){ const ag = agents.get(key); if (!ag || ag.kind !== 'human') return false; ag.moving = false; ag.stepI = i % ag.steps.length; startStep(ag); if (ag.moving){ const t = ag.route[1]; ag.root.position.set(t[0], groundY(t[0], t[1]), t[1]); } return true; }
  return { init, sync, update, onHour, stats, agents, group, debugStep, get camp(){ return camp; } };
})();


/* ================= PROGRESSION (objectif de poids -> village) ================= */
const Progress = (() => {
  const KEY = 'medivalfit.progress.v1';
  let pct = 0; try { const v = parseInt(localStorage.getItem(KEY) || '0', 10); if (!isNaN(v)) pct = clamp(v, 0, 100); } catch (e) {}
  const done = new Set();
  function save(){ try { localStorage.setItem(KEY, String(pct)); } catch (e) {} }
  /* amène le village à l'état correspondant au pourcentage, sans cinématique */
  function applyInstant(){
    for (const st of STEPS){ const key = st.pct; if (st.pct <= pct && !done.has(key)){ doStep(st); done.add(key); } }
    for (let i = STEPS.length - 1; i >= 0; i--){ const st = STEPS[i]; if (st.pct > pct && done.has(st.pct)){ undoStep(st); done.delete(st.pct); } }
    Cosmetics.onBuilding(); Population.sync(); render();
  }
  function setPct(v, animate){
    v = clamp(Math.round(v / 5) * 5, 0, 100);
    if (animate && v === pct + 5 && !cine.active){ pct = v; save(); const st = STEPS.find(x => x.pct === v); if (st){ done.add(st.pct); startStep(st); } render(); return; }
    pct = v; save(); applyInstant();
  }
  function render(){
    const t = tierFor(pct); $('#tier').textContent = t.name; $('#prog').value = pct; $('#progTxt').textContent = pct + ' %';
    const next = STEPS.find(x => x.pct > pct);
    $('#nextStep').textContent = next ? 'Prochaine étape à ' + next.pct + ' % : ' + next.label : 'Village terminé : Cité (objectif atteint)';
    $('#weigh').disabled = !next || cine.active; $('#weigh').textContent = next ? 'Pesée : +5 % → ' + next.label : 'Objectif atteint !';
  }
  return { get pct(){ return pct; }, setPct, applyInstant, render };
})();
/* confirmation dans la page : renvoie une promesse (true = confirmé) */
function ask(txt, yes){ return new Promise(res => {
  const box = $('#ask'); $('#askTxt').textContent = txt; $('#askYes').textContent = yes || 'Confirmer'; box.classList.add('open');
  const done = v => { box.classList.remove('open'); $('#askYes').onclick = $('#askNo').onclick = null; res(v); };
  $('#askYes').onclick = () => done(true); $('#askNo').onclick = () => done(false);
}); }
$('#weigh').addEventListener('click', () => { if (!cine.active) Progress.setPct(Progress.pct + 5, true); });
// le curseur de test : aperçu pendant le glissement, application au relâchement ; revenir en arrière retire des constructions, donc on demande
$('#prog').addEventListener('input', e => { if (cine.active){ e.target.value = Progress.pct; return; } $('#progTxt').textContent = e.target.value + ' %'; });
$('#prog').addEventListener('change', async e => {
  if (cine.active){ e.target.value = Progress.pct; return; }
  const v = clamp(Math.round(parseInt(e.target.value, 10) / 5) * 5, 0, 100);
  if (v < Progress.pct){
    const lost = STEPS.filter(s => s.pct > v && s.pct <= Progress.pct && s.kind !== 'upgrade').length;
    const ok = await ask('Revenir à ' + v + ' % ? ' + (lost ? lost + ' construction' + (lost > 1 ? 's seront retirées' : ' sera retirée') + ' du village.' : 'Les dernières améliorations seront annulées.'), 'Revenir à ' + v + ' %');
    if (!ok){ Progress.render(); return; }
  }
  Progress.setPct(v, false);
});
$('#resetBtn').addEventListener('click', async () => { if (cine.active) return; if (await ask('Remettre le village à zéro ? Toutes les constructions seront retirées (les cosmétiques sont conservés).', 'Tout recommencer')) Progress.setPct(0, false); });
$('#focus').addEventListener('click', () => { if (cam.locked) return; fly = { from: cam.target.clone(), to: new THREE.Vector3(2, 0, 4), d0: cam.dist, d1: 42, t: 0 }; });
$('#hour').addEventListener('input', e => { const h = parseFloat(e.target.value); $('#hourTxt').textContent = Math.floor(h) + ' h' + (h % 1 >= .5 ? '30' : ''); setSun(h); });


/* ================= COSMÉTIQUES =================
   Catalogue dans core.js (COSMETICS / cosmeticPieces). Ici : points, déblocage, état sauvegardé, rendu des objets,
   teintes (bannière, toits), lumières de nuit et particules (lucioles, pétales). */
const Cosmetics = (() => {
  const KEY = 'medivalfit.cosmetics.v1';
  const state = { points: 30, unlocked: {}, active: {} };
  try { const raw = localStorage.getItem(KEY); if (raw){ const o = JSON.parse(raw); Object.assign(state, o); } } catch (e) {}
  function save(){ try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {} }
  const byId = Object.fromEntries(COSMETICS.map(c => [c.id, c]));
  const groups = {};          // id -> Group (objets statiques)
  const lamps = [];           // { sprite, light }
  let night = false, lastHour = 10;
  const root = new THREE.Group(); root.name = 'cosmetiques'; scene.add(root);
  // lueur de lanterne (sprite additif)
  const glowTex = (() => { const cv = document.createElement('canvas'); cv.width = cv.height = 64; const cx = cv.getContext('2d'); const g = cx.createRadialGradient(32, 32, 0, 32, 32, 32); g.addColorStop(0, 'rgba(255,220,150,1)'); g.addColorStop(0.35, 'rgba(255,170,80,0.55)'); g.addColorStop(1, 'rgba(255,120,30,0)'); cx.fillStyle = g; cx.fillRect(0, 0, 64, 64); const t = new THREE.CanvasTexture(cv); t.colorSpace = THREE.SRGBColorSpace; return t; })();
  const glowMat = new THREE.SpriteMaterial({ map: glowTex, color: 0xffc070, transparent: true, blending: THREE.AdditiveBlending, depthWrite: false, opacity: 0 });
  const postMat = new THREE.MeshStandardMaterial({ color: 0x4a3524, roughness: 0.9 });

  function isUnlocked(c, optId){ return c.type === 'choice' ? (optId === c.options[0].id || !!(state.unlocked[c.id] && state.unlocked[c.id][optId])) : !!state.unlocked[c.id]; }
  function unlock(c, optId){
    const cost = c.type === 'choice' ? c.options.find(o => o.id === optId).cost : c.cost;
    if (isUnlocked(c, optId)) return true;
    if (state.points < cost){ showMsg('Il manque ' + (cost - state.points) + ' point' + (cost - state.points > 1 ? 's' : '') + ' cosmétique' + (cost - state.points > 1 ? 's' : '')); return false; }
    state.points -= cost;
    if (c.type === 'choice'){ state.unlocked[c.id] = state.unlocked[c.id] || {}; state.unlocked[c.id][optId] = true; } else state.unlocked[c.id] = true;
    save(); return true;
  }
  function setActive(c, value){ // value : true/false ou id d'option
    state.active[c.id] = value; save(); apply(c.id); render();
  }
  function addPoints(n){ state.points += n; save(); render(); showMsg('+' + n + ' points cosmétiques (séance de sport)'); }

  /* ----- rendu ----- */
  function disposeGroup(g){ g.traverse(o => { if (o.isMesh){ o.geometry && o.geometry.dispose && !o.isInstancedMesh && o.geometry.dispose(); } }); root.remove(g); }
  function buildGroupFor(id){
    const list = cosmeticPieces(id, layout, sc);
    const g = new THREE.Group(); g.name = 'cosmo-' + id;
    const identity = new THREE.Matrix4();
    if (list.length > 25){   // beaucoup d'objets identiques : instanciation par type
      const byType = {}; for (const it of list){ (byType[it.kit + '/' + it.name] = byType[it.kit + '/' + it.name] || []).push({ x: it.pos[0], y: it.pos[1], z: it.pos[2], rot: it.rot, s: it.scale }); }
      for (const [key, items] of Object.entries(byType)) addInstanced(g, key, items, { castShadow: id !== 'dalles' });
    } else {
      const statics = buildStatic(list, identity); g.add(statics);
    }
    // piquets et lumières
    for (const it of list){
      if (it.post){ const [x, y, z, h] = it.post; const m = new THREE.Mesh(new THREE.CylinderGeometry(0.06, 0.08, h, 7), postMat); m.position.set(x, y + h / 2, z); m.castShadow = true; g.add(m); }
      if (it.light){
        const sp = new THREE.Sprite(glowMat.clone()); sp.scale.set(1.6, 1.6, 1); const c = Math.cos(it.rot), sn = Math.sin(it.rot);
        sp.position.set(it.pos[0] + 0.95 * sn * (it.scale || 1), it.pos[1] + 0.35, it.pos[2] + 0.95 * c * (it.scale || 1)); g.add(sp);
        const light = new THREE.PointLight(0xffb060, 0, 11, 2); light.position.copy(sp.position); g.add(light);
        lamps.push({ sprite: sp, light });
      }
    }
    return g;
  }
  function apply(id){
    const c = byId[id], val = state.active[id];
    if (c.type === 'choice'){
      const opt = c.options.find(o => o.id === (val || c.options[0].id)) || c.options[0];
      if (id === 'banner'){ const B = built.market; if (B) for (const m of B.group.userData.materials) if (/Banner/.test(m.name)){ if (opt.color){ m.vertexColors = false; m.color.setRGB(opt.color[0], opt.color[1], opt.color[2]); } else { m.vertexColors = true; m.color.setRGB(1, 1, 1); } m.needsUpdate = true; } }
      if (id === 'roof'){ for (const k in built) for (const m of (built[k].group.userData.materials || [])) if (/RoundTiles/.test(m.name)){
        const t = opt.color ? [opt.color[0], opt.color[1], opt.color[2], 1] : [1, 1, 1, 0]; m.userData.roofTint = t;
        if (m.userData.roofUniforms){ m.userData.roofUniforms.uRoofTint.value.setRGB(t[0], t[1], t[2]); m.userData.roofUniforms.uRoofMix.value = t[3]; } } }
      return;
    }
    if (id === 'lucioles' || id === 'petales') return;   // particules : gérées dans update()
    // objets : (re)construits à la demande
    if (groups[id]){ for (let i = lamps.length - 1; i >= 0; i--) if (groups[id].getObjectById(lamps[i].sprite.id)) lamps.splice(i, 1); disposeGroup(groups[id]); delete groups[id]; }
    if (val){ groups[id] = buildGroupFor(id); root.add(groups[id]); applyNight(); }
  }
  function applyAll(){ for (const c of COSMETICS) apply(c.id); }
  /* après une construction : les cosmétiques liés aux maisons se rebâtissent */
  function onBuilding(){ for (const id of ['lierre', 'lanternes', 'fleurs', 'potager']) if (state.active[id]) apply(id); apply('roof'); apply('banner'); }
  /* nuit : lanternes allumées (3 lumières max pour le téléphone), lueurs visibles */
  function applyNight(){
    let nLights = 0;
    for (const l of lamps){ l.sprite.material.opacity = night ? 0.9 : 0; l.light.intensity = night && nLights < 3 ? 14 : 0; if (night && nLights < 3) nLights++; }
  }
  function onHour(h){ lastHour = h; const n = h >= 18.6 || h <= 6.2; if (n !== night){ night = n; applyNight(); } }
  /* particules d'ambiance */
  let accF = 0, accP = 0;
  function update(dt){
    if (state.active.lucioles && night){ accF += dt; while (accF > 0.07){ accF -= 0.07; const a = Math.random() * 6.28, d = 4 + Math.random() * 30, x = cam.target.x + Math.cos(a) * d, z = cam.target.z + Math.sin(a) * d;
      Particles.spawn({ x, y: terrainHeight(x, z) + 0.4 + Math.random() * 1.6, z, vx: (Math.random() - .5) * .6, vy: (Math.random() - .5) * .3, vz: (Math.random() - .5) * .6, c: [1, 0.92, 0.45], size: .13 + Math.random() * .08, grow: 1, life: 2 + Math.random() * 2, alpha: .95, drag: .2, lift: 0 }); } }
    if (state.active.petales && !night){ accP += dt; while (accP > 0.11){ accP -= 0.11; const a = Math.random() * 6.28, d = Math.random() * 26, x = cam.target.x + Math.cos(a) * d - 9, z = cam.target.z + Math.sin(a) * d - 5;
      Particles.spawn({ x, y: terrainHeight(x, z) + 1.5 + Math.random() * 4.5, z, vx: 1.1 + Math.random() * .8, vy: -.1, vz: .5 + Math.random() * .5, c: [1, 0.62, 0.78], size: .13 + Math.random() * .07, grow: 1, life: 5 + Math.random() * 3, alpha: .9, drag: .05, lift: -.12 }); } }
  }
  /* ----- interface ----- */
  const panel = $('#cosmo'), list = $('#cosmoList');
  function render(){
    $('#cpts').textContent = state.points + ' pt' + (state.points > 1 ? 's' : '');
    let html = '', cat = null;
    for (const c of COSMETICS){
      if (c.cat !== cat){ cat = c.cat; html += '<div class="ccat">' + cat + '</div>'; }
      if (c.type === 'choice'){
        const cur = state.active[c.id] || c.options[0].id;
        html += '<div class="citem on"><div class="txt"><div class="nm">' + c.name + '</div><div class="ds">' + c.desc + '</div><div class="opts">';
        for (const o of c.options){
          const un = isUnlocked(c, o.id), sel = o.id === cur, sw = o.color ? 'rgb(' + o.color.map(v => Math.round(Math.pow(v, 1 / 2.2) * 255)).join(',') + ')' : (c.id === 'banner' ? 'rgb(40,80,190)' : 'rgb(200,95,60)');
          html += '<button class="opt' + (sel ? ' sel' : '') + (un ? '' : ' lock') + '" data-c="' + c.id + '" data-o="' + o.id + '"><span class="sw" style="background:' + sw + '"></span>' + o.name + (un ? '' : ' · ' + o.cost + ' pts') + '</button>';
        }
        html += '</div></div></div>';
      } else {
        const un = isUnlocked(c), on = !!state.active[c.id];
        html += '<div class="citem' + (on ? ' on' : '') + '"><div class="txt"><div class="nm">' + c.name + '</div><div class="ds">' + c.desc + '</div></div>';
        if (!un) html += '<button data-c="' + c.id + '" data-a="unlock"' + (state.points < c.cost ? ' disabled' : '') + '>Débloquer · ' + c.cost + ' pts</button>';
        else html += '<button class="' + (on ? 'ghost' : '') + '" data-c="' + c.id + '" data-a="toggle">' + (on ? 'Retirer' : 'Activer') + '</button>';
        html += '</div>';
      }
    }
    list.innerHTML = html;
  }
  list.addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b) return;
    const c = byId[b.dataset.c]; if (!c) return;
    if (c.type === 'choice'){ const o = b.dataset.o; if (unlock(c, o)) setActive(c, o); else render(); return; }
    if (b.dataset.a === 'unlock'){ if (unlock(c)) setActive(c, true); else render(); }
    else setActive(c, !state.active[c.id]);
  });
  $('#cosmoBtn').addEventListener('click', () => { panel.classList.toggle('open'); render(); });
  $('#cosmoClose').addEventListener('click', () => panel.classList.remove('open'));
  $('#seance').addEventListener('click', () => addPoints(3));
  return { state, applyAll, apply, onBuilding, onHour, update, render, addPoints };
})();

/* ================= DIVERS UI ================= */
let hintShown = true; function hideHint(){ if (hintShown){ hintShown = false; setTimeout(() => { $('#hint').textContent = 'Double-touche : s’approcher d’un point. Le curseur règle l’heure.'; }, 400); } }
let msgT = null; function showMsg(t){ const m = $('#msg'); m.textContent = t; m.style.opacity = 1; clearTimeout(msgT); msgT = setTimeout(() => m.style.opacity = 0, 3500); }

/* ================= BOUCLE ================= */
function resize(){ const w = window.innerWidth, h = window.innerHeight; renderer.setSize(w, h, false); camera.aspect = w / h; camera.fov = w < h ? 52 : 42; camera.updateProjectionMatrix(); Particles.setScale(h); }
window.addEventListener('resize', resize);
let water = null; const clock = new THREE.Clock(); let fpsN = 0, fpsT = 0, fps = 0, smokeT = 0, prCur = PR;
function loop(){
  const dt = Math.min(clock.getDelta(), .05), now = clock.elapsedTime;
  if (cine.active) updateBuild(dt); else updateCamera(dt);
  GrassField.update(false); TreeLOD.update(camera.position, false);
  Cosmetics.update(dt);
  Population.update(dt);
  for (const m of mills) m.rotation.z += dt * 0.35;
  if (water) water.material.uniforms.uTime.value = now;
  windUniform.value = now;
  // fumée des cheminées
  smokeT += dt; if (smokeT > .12){ smokeT = 0; for (const id in built) for (const c of built[id].chimneys) Particles.spawn({ x: c.x + (Math.random()-.5)*.3, y: c.y, z: c.z + (Math.random()-.5)*.3, vx: (Math.random()-.5)*.3 + .25, vy: .8 + Math.random()*.5, vz: (Math.random()-.5)*.3, c: SMOKE[Math.random() < .5 ? 0 : 1], size: .5 + Math.random()*.4, grow: 2.4, life: 2.5 + Math.random()*1.5, alpha: .28, drag: .5, lift: .35 }); }
  Particles.update(dt);
  renderer.render(scene, camera);
  fpsN++; fpsT += dt; if (fpsT >= 1){ fps = Math.round(fpsN / fpsT); fpsN = 0; fpsT = 0; const i = renderer.info.render; const ps = Population.stats(); $('#stats').textContent = fps + ' im/s · ' + Math.round(i.triangles / 1000) + 'k tri · ' + i.calls + ' appels · ' + ps.humans + ' hab. · ' + ps.animals + ' bêtes';
    // appareil lent : moins de touffes (plus grosses) ; on remonte lentement si ça respire
    if (!cine.active){
      if (fps < 27){ if (GrassField.quality > 0.45) GrassField.setQuality(GrassField.quality - 0.15); else if (prCur > 1.3){ prCur -= 0.25; renderer.setPixelRatio(prCur); } }
      else if (fps > 56 && now > 8) GrassField.setQuality(GrassField.quality + 0.03); } }
}

/* ================= DÉMARRAGE ================= */
async function main(){
  const bar = $('#bar'), lm = $('#loadmsg');
  lm.textContent = 'Terrain et rivière…'; await new Promise(r => setTimeout(r, 30));
  buildTerrain(); water = buildWater();
  setSun(parseFloat($('#hour').value)); bakeEnv();
  lm.textContent = 'Chargement des kits 3D (22 Mo)…';
  const prog = { village: 0, nature: 0, props: 0, grass: 0, people: 0, animals: 0 };
  await loadAll((kit, f) => { prog[kit] = f; const tot = (prog.village * 5 + prog.nature * 8 + prog.props * 4 + prog.grass * 1 + prog.people * 6 + prog.animals * 3) / 27; bar.style.width = (tot * 100) + '%'; lm.textContent = 'Chargement des kits 3D… ' + Math.round(tot * 100) + ' %'; });
  lm.textContent = 'Assemblage du village…'; await new Promise(r => setTimeout(r, 30));
  lm.textContent = 'On sème l’herbe…'; await new Promise(r => setTimeout(r, 30));
  GrassField.init(); scene.add(GrassField.group);
  createNature();
  Population.init();
  Progress.applyInstant();
  resize(); applyCamera(); GrassField.update(true); TreeLOD.update(camera.position, true);
  Cosmetics.applyAll(); Cosmetics.render(); Cosmetics.onHour(parseFloat($('#hour').value));
  renderer.compile(scene, camera);
  renderer.setAnimationLoop(loop);
  window.__ready = true;
  window.__v3d = { cam, applyCamera, camera, scene, renderer, built, structures, layout, setSun, THREE, GrassField, TreeLOD, cine, Cosmetics, Progress, updateBuild, Particles, Population, People, Fauna };
  const l = $('#load'); l.style.opacity = 0; setTimeout(() => l.remove(), 900);
}
main().catch(e => { console.error(e); fatal('Erreur au démarrage : ' + (e && e.message ? e.message : e)); });
</script>
